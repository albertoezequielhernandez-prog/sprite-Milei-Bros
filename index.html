<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Milei Bros v3</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;font-family:'Arial Black',Arial,sans-serif}
canvas{display:block;image-rendering:pixelated}
#load{position:fixed;inset:0;background:#0a0a1a;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:9999;color:#FFD700}
#load h1{font-size:52px;text-shadow:0 0 30px #FFD700;margin-bottom:8px;letter-spacing:4px}
#load p{color:#aaa;margin-bottom:18px;font-size:15px}
#pbc{width:380px;height:18px;background:#222;border:2px solid #FFD700;border-radius:4px;overflow:hidden}
#pb{height:100%;background:linear-gradient(90deg,#FFD700,#FF8C00);width:0%;transition:width .1s}
#pct{margin-top:8px;font-size:13px;color:#FFD700}
#slogan{margin-top:24px;font-size:22px;color:#fff;font-style:italic;animation:blink 1.5s infinite}
#err{position:fixed;top:0;left:0;right:0;background:#aa0000;color:#fff;padding:10px 14px;font-size:13px;z-index:99999;font-family:monospace;display:none;max-height:25vh;overflow:auto}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>
<body>
<div id="load">
  <h1>⚡ MILEI BROS ⚡</h1>
  <p>Cargando assets del juego...</p>
  <div id="pbc"><div id="pb"></div></div>
  <div id="pct">0%</div>
  <div id="slogan">¡VIVA LA LIBERTAD, CARAJO!</div>
</div>
<div id="err"></div>

<script>
window.onerror = function(msg, src, line) {
  // Only show non-CORS errors (line 0 = cross-origin script error, usually audio)
  if (line > 0) {
    var e = document.getElementById('err');
    e.style.display = 'block';
    e.innerHTML += '<b>ERROR línea ' + line + ':</b> ' + msg + '<br>';
  }
  return false; // don't suppress
};
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.60.0/phaser.min.js"></script>
<script>

var BASE = 'https://albertoezequielhernandez-prog.github.io/sprite-Milei-Bros/';
var GW = 800, GH = 450;

// NES Mario physics values at 60fps converted to px/sec
var WALK   = 90;   // 1.5 px/frame * 60
var RUN    = 150;  // 2.5 px/frame * 60
var ACCEL  = 600;  // ~10 frames to max
var DRAG   = 700;
var JUMP_V = -500;
var DJUMP  = -370;
var GRAV   = 1400;

window.GS = { lives:3, coins:0, fiscal:50, level:0, score:0, pendingPU:null };

var LEVELS = [
  { bg:'bg_casa',   name:'CASA ROSADA',    bk:'del_cano',   ba:'dc', bn:'NICO DEL CAÑO',    ally:'ally_alberdi',   an:'ALBERDI',    hp:100 },
  { bg:'bg_cong',   name:'EL CONGRESO',    bk:'massa',      ba:'ma', bn:'MASSA PANQUEQUE',  ally:'ally_cavallo',   an:'CAVALLO',    hp:120 },
  { bg:'bg_pan',    name:'EL PANTANO',     bk:'kicillof',   ba:'ki', bn:'KICILLOF',          ally:'ally_sarmiento', an:'SARMIENTO',  hp:130 },
  { bg:'bg_como',   name:'COMODORO PY',    bk:'cristina',   ba:'cf', bn:'CFK',               ally:'ally_nisman',    an:'NISMAN',     hp:150 },
  { bg:'bg_banco',  name:'BANCO CENTRAL',  bk:'larreta',    ba:'la', bn:'LARRETA',           ally:'ally_adam',      an:'ADAM SMITH', hp:140 },
  { bg:'bg_senado', name:'EL SENADO',      bk:'villarruel', ba:'vi', bn:'VILLARRUEL',        ally:'ally_sanmartin', an:'SAN MARTÍN', hp:160 },
  { bg:'bg_afip',   name:'LA AFIP',        bk:'moreno',     ba:'mr', bn:'MORENO',            ally:'ally_friedman',  an:'FRIEDMAN',   hp:180 },
  { bg:'bg_fmi',    name:'EL FMI',         bk:'boss_fmi',   ba:'fi', bn:'LA CASTA SUPREMA',  ally:'ally_hayek',     an:'HAYEK',      hp:300 },
];

// =============================================================
// BOOT
// =============================================================
var Boot = new Phaser.Class({
  Extends: Phaser.Scene,
  initialize: function Boot() { Phaser.Scene.call(this, { key: 'Boot' }); },

  preload: function() {
    var pb  = document.getElementById('pb');
    var pct = document.getElementById('pct');
    this.load.on('progress', function(v) { pb.style.width = (v*100)+'%'; pct.textContent = Math.floor(v*100)+'%'; });
    this.load.on('complete', function() { document.getElementById('load').style.display = 'none'; });

    // Backgrounds
    this.load.image('bg_casa',   BASE+'assets/backgrounds/Casa%20rosada.png');
    this.load.image('bg_cong',   BASE+'assets/backgrounds/Congreso.png');
    this.load.image('bg_pan',    BASE+'assets/backgrounds/pantano.png');
    this.load.image('bg_como',   BASE+'assets/backgrounds/Comodoro%20py.png');
    this.load.image('bg_banco',  BASE+'assets/backgrounds/banco%20central.png');
    this.load.image('bg_senado', BASE+'assets/backgrounds/senado.png');
    this.load.image('bg_afip',   BASE+'assets/backgrounds/AFIP.png');
    this.load.image('bg_fmi',    BASE+'assets/backgrounds/FMI.png');

    // Allies
    this.load.image('ally_alberdi',   BASE+'assets/allies/sprite%20alberdi%20optimizado.png');
    this.load.image('ally_nisman',    BASE+'assets/allies/sprite%20nismann%20optimizado.png');
    this.load.image('ally_cavallo',   BASE+'assets/allies/sprite%20cavallo%20optimizado.png');
    this.load.image('ally_sarmiento', BASE+'assets/allies/sprite%20sarmiento%20optimizado.png');
    this.load.image('ally_adam',      BASE+'assets/allies/sprite%20adam%20smith%20optimizado.png');
    this.load.image('ally_sanmartin', BASE+'assets/allies/sprite%20San%20Martin%20optimizado.png');
    this.load.image('ally_friedman',  BASE+'assets/allies/sprite%20friedman%20optimizado.png');
    this.load.image('ally_hayek',     BASE+'assets/allies/sprite%20hayek%20optimizado.png');
    this.load.image('ally_espert',    BASE+'assets/allies/sprite%20Espert%20optimizado.png');

    // Spritesheets loaded as raw images - auto frame detect in create()
    this._ss = [
      // cols/rows computed from actual pixel dimensions of each file
      { raw:'r_milei',  key:'milei',      url:'assets/sprites/spritesheets%20milei%20optimizado.png',                          c:13, r:1 },
      { raw:'r_ck',     key:'cuca_k',     url:'assets/sprites/spritesheets%20cucaracha%20k%20optimizado.png',                 c:9,  r:4 },
      { raw:'r_ca',     key:'cuca_arm',   url:'assets/sprites/spritesheets%20cucaracha%20k%20armada%20optimizado.png',        c:8,  r:1 },
      { raw:'r_si',     key:'sind',       url:'assets/sprites/spritesheets%20sindicalista%20optmizado.png',                   c:9,  r:1 },
      { raw:'r_dc',     key:'del_cano',   url:'assets/sprites/spritesheets%20del%20ca%C3%B1o%20optimizado.png',               c:4,  r:3 },
      { raw:'r_ma',     key:'massa',      url:'assets/sprites/spritesheets%20massa%20optimizado.png',                         c:3,  r:4 },
      { raw:'r_ki',     key:'kicillof',   url:'assets/sprites/spritesheets%20kicillof%20optimizado.png',                     c:3,  r:4 },
      { raw:'r_cf',     key:'cristina',   url:'assets/sprites/spritesheets%20cristina%20optimizado.png',                     c:4,  r:3 },
      { raw:'r_la',     key:'larreta',    url:'assets/sprites/spritesheets%20larreta%20optimizado.png',                      c:3,  r:4 },
      { raw:'r_vi',     key:'villarruel', url:'assets/sprites/spritesheets%20villarruel%20optimizado.png',                   c:3,  r:3 },
      { raw:'r_mo',     key:'morsa',      url:'assets/sprites/spritesheets%20morsa%20fernandez.png',                          c:3,  r:3 },
      { raw:'r_mr',     key:'moreno',     url:'assets/bosses/spritesheets%20moreno%20optimizado.png',                        c:4,  r:3 },
      { raw:'r_fi',     key:'boss_fmi',   url:'assets/bosses/boss%20fmi.png',                                                c:4,  r:3 },
      { raw:'r_macri',  key:'macri',      url:'assets/sprites/spritesheets%20macri%20gato_macri_transparent%20opti....png',  c:7,  r:3 },
      { raw:'r_pups',   key:'pups',       url:'assets/powerups/sprites%20power-ups.png',                                     c:5,  r:1 },
    ];
    for (var i = 0; i < this._ss.length; i++) {
      this.load.image(this._ss[i].raw, BASE + this._ss[i].url);
    }

    // Audio - wrapped in try/catch to prevent crashes if files unavailable
    try {
      this.load.audio('snd_z', BASE+'assets/music/voz_milei_zurdos.mp3');
      this.load.audio('snd_v', BASE+'assets/music/voz_milei_viva_libertad.mp3');
      this.load.audio('snd_c', BASE+'assets/music/voz_milei_completo.mp3');
    } catch(e) { console.warn('Audio load error:', e); }
  },

  create: function() {
    // White pixel for platform bodies
    var g = this.make.graphics({ add: false });
    g.fillStyle(0xFFFFFF, 1);
    g.fillRect(0, 0, 4, 4);
    g.generateTexture('px', 4, 4);
    g.destroy();

    // Convert raw images → transparent spritesheets (removes white/light backgrounds)
    for (var i = 0; i < this._ss.length; i++) {
      var s = this._ss[i];
      try {
        var tex = this.textures.get(s.raw);
        var srcImg = tex.getSourceImage();
        var fw = Math.floor(srcImg.width  / s.c);
        var fh = Math.floor(srcImg.height / s.r);
        console.log('SS ' + s.key + ': ' + srcImg.width + 'x' + srcImg.height + ' => frame ' + fw + 'x' + fh);

        // Remove white/near-white background via canvas
        var cv = document.createElement('canvas');
        cv.width  = srcImg.width;
        cv.height = srcImg.height;
        var ctx = cv.getContext('2d');
        ctx.drawImage(srcImg, 0, 0);
        var idata = ctx.getImageData(0, 0, cv.width, cv.height);
        var d = idata.data;
        for (var p = 0; p < d.length; p += 4) {
          var r = d[p], g = d[p+1], b = d[p+2];
          // Remove white and near-white, also checkerboard grey
          if ((r > 220 && g > 220 && b > 220) ||
              (r > 180 && g > 180 && b > 180 && Math.abs(r-g)<15 && Math.abs(g-b)<15)) {
            d[p+3] = 0;
          }
        }
        ctx.putImageData(idata, 0, 0);

        this.textures.addSpriteSheet(s.key, cv, { frameWidth: fw, frameHeight: fh });
      } catch(e) {
        console.warn('Failed spritesheet: ' + s.key, e.message);
      }
    }

    this._buildAnims();
    this.scene.start('Title');
  },

  _anim: function(key, src, s, e, fps, loop) {
    try {
      if (!this.anims.exists(key)) {
        this.anims.create({
          key: key,
          frames: this.anims.generateFrameNumbers(src, { start: s, end: e }),
          frameRate: fps,
          repeat: loop ? -1 : 0
        });
      }
    } catch(err) { console.warn('Anim fail: ' + key, err.message); }
  },

  _buildAnims: function() {
    var a = this._anim.bind(this);
    // Milei
    a('m_idle', 'milei', 0, 1,  4,  true);
    a('m_walk', 'milei', 2, 5,  12, true);
    a('m_jump', 'milei', 6, 6,  1,  true);
    a('m_atk',  'milei', 7, 10, 14, false);
    a('m_hit',  'milei', 11, 11, 1, false);
    a('m_die',  'milei', 11, 12, 6, false);
    // Cucaracha K
    a('ck_walk', 'cuca_k', 0, 2, 8, true);
    a('ck_die',  'cuca_k', 3, 6, 8, false);
    // Armada
    a('ca_walk', 'cuca_arm', 0, 2, 8, true);
    a('ca_hit',  'cuca_arm', 3, 5, 8, false);
    a('ca_die',  'cuca_arm', 6, 7, 6, false);
    // Sindicalista
    a('si_walk', 'sind', 0, 2, 6, true);
    a('si_die',  'sind', 6, 8, 6, false);
    // Bosses
    var bosses = [
      {p:'dc',k:'del_cano',  i0:0,i1:1, a0:2,a1:5,  d0:6,d1:11},
      {p:'ma',k:'massa',     i0:0,i1:1, a0:2,a1:7,  d0:9,d1:11},
      {p:'ki',k:'kicillof',  i0:0,i1:1, a0:2,a1:5,  d0:9,d1:10},
      {p:'cf',k:'cristina',  i0:0,i1:1, a0:2,a1:7,  d0:9,d1:10},
      {p:'la',k:'larreta',   i0:0,i1:1, a0:2,a1:5,  d0:9,d1:11},
      {p:'vi',k:'villarruel',i0:0,i1:1, a0:2,a1:5,  d0:6,d1:8},
      {p:'mo',k:'morsa',     i0:0,i1:1, a0:3,a1:5,  d0:7,d1:8},
      {p:'mr',k:'moreno',    i0:0,i1:1, a0:4,a1:7,  d0:10,d1:11},
      {p:'fi',k:'boss_fmi',  i0:0,i1:1, a0:2,a1:5,  d0:10,d1:11},
    ];
    for (var i = 0; i < bosses.length; i++) {
      var b = bosses[i];
      a(b.p+'_idle', b.k, b.i0, b.i1, 4,  true);
      a(b.p+'_atk',  b.k, b.a0, b.a1, 8,  false);
      a(b.p+'_die',  b.k, b.d0, b.d1, 6,  false);
    }
    // Macri
    a('mg_idle', 'macri', 0, 2, 4, true);
    a('mg_good', 'macri', 4, 4, 4, false);
    a('mg_bad',  'macri', 5, 5, 4, false);
    a('mg_exit', 'macri', 6, 8, 6, false);
    // Power-ups
    // powerups: 5 static frames (no animation - use setFrame())
    // dollar=0, chainsaw=1, hayek=2, mane=3, shield=4
    a('pu_dollar',   'pups', 0, 0, 4, true);
    a('pu_chainsaw', 'pups', 1, 1, 4, true);
    a('pu_hayek',    'pups', 2, 2, 4, true);
    a('pu_mane',     'pups', 3, 3, 4, true);
    a('pu_shield',   'pups', 4, 4, 4, true);
  }
});

// =============================================================
// TITLE
// =============================================================
var Title = new Phaser.Class({
  Extends: Phaser.Scene,
  initialize: function Title() { Phaser.Scene.call(this, { key: 'Title' }); },

  create: function() {
    window.GS = { lives:3, coins:0, fiscal:50, level:0, score:0, pendingPU:null };

    this.add.image(GW/2, GH/2, 'bg_casa').setDisplaySize(GW, GH);
    this.add.rectangle(GW/2, GH/2, GW, GH, 0x000033, 0.55);

    // Stars
    for (var i = 0; i < 20; i++) {
      var star = this.add.circle(
        Phaser.Math.Between(0, GW), Phaser.Math.Between(0, GH),
        Phaser.Math.Between(1, 3), 0xFFFFFF, Phaser.Math.FloatBetween(0.3, 1)
      );
      this.tweens.add({ targets: star, alpha: 0, duration: Phaser.Math.Between(500, 2000), yoyo: true, repeat: -1, delay: Phaser.Math.Between(0, 2000) });
    }

    // Title
    this.add.text(GW/2+3, 73, '⚡ MILEI BROS ⚡', { fontSize:'50px', fill:'#000', fontFamily:'Arial Black' }).setOrigin(0.5);
    var ttl = this.add.text(GW/2, 70, '⚡ MILEI BROS ⚡', { fontSize:'50px', fill:'#FFD700', stroke:'#7B3F00', strokeThickness:6, fontFamily:'Arial Black' }).setOrigin(0.5);
    this.tweens.add({ targets: ttl, scaleX: 1.04, scaleY: 1.04, duration: 900, yoyo: true, repeat: -1 });

    // Hero
    var hero = this.add.sprite(GW/2, GH/2-20, 'milei').setScale(0.45);
    try { hero.play('m_idle'); } catch(e) {}
    this.tweens.add({ targets: hero, y: GH/2-22, duration: 700, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });

    // Enemy cucarachas
    try {
      var el = this.add.sprite(60, GH-70, 'cuca_k').setScale(0.35); el.play('ck_walk');
      var er = this.add.sprite(GW-60, GH-70, 'cuca_k').setScale(0.35).setFlipX(true); er.play('ck_walk');
    } catch(e) {}

    // Coins at bottom
    var coinX = [90, 210, 330, 470, 590, 710];
    for (var i = 0; i < coinX.length; i++) {
      var c = this.add.sprite(coinX[i], GH-35, 'pups').setScale(0.07).setFrame(0);
    }

    // Menu
    var scene = this;
    var sel = 0;
    var opts = [
      { t: '▶  NUEVA PARTIDA', fn: function() { scene.scene.start('Game'); } },
      { t: '⌨  CONTROLES',     fn: function() { scene._showCtrls(); } },
      { t: '📊  PUNTAJE: 0',    fn: function() {} },
    ];

    var mi = [];
    for (var i = 0; i < opts.length; i++) {
      (function(idx) {
        var m = scene.add.text(GW/2, GH/2+90+idx*40, opts[idx].t, {
          fontSize: '20px', fill: idx === 0 ? '#FFD700' : '#FFF',
          fontFamily: 'Arial Black', stroke: '#000', strokeThickness: 3
        }).setOrigin(0.5).setInteractive();
        m.on('pointerdown', function() { opts[idx].fn(); });
        m.on('pointerover', function() { sel = idx; upd(); });
        mi.push(m);
      })(i);
    }

    function upd() {
      for (var j = 0; j < mi.length; j++) {
        mi[j].setStyle({ fill: j === sel ? '#FFD700' : '#FFF' });
        mi[j].setScale(j === sel ? 1.08 : 1);
      }
    }

    var KC = Phaser.Input.Keyboard.KeyCodes;
    this.input.keyboard.addKey(KC.UP).on('down',    function() { sel = (sel - 1 + opts.length) % opts.length; upd(); });
    this.input.keyboard.addKey(KC.DOWN).on('down',  function() { sel = (sel + 1) % opts.length; upd(); });
    this.input.keyboard.addKey(KC.ENTER).on('down', function() { opts[sel].fn(); });
    this.input.keyboard.addKey(KC.SPACE).on('down', function() { opts[0].fn(); });

    var ps = this.add.text(GW/2, GH-28, '✦ ENTER TO START ✦', { fontSize: '13px', fill: '#fff', fontFamily: 'Arial' }).setOrigin(0.5);
    this.tweens.add({ targets: ps, alpha: 0, duration: 500, yoyo: true, repeat: -1 });
    this.add.text(8, GH-15, '© 2025 VIVA LA LIBERTAD', { fontSize: '10px', fill: '#FFD700', fontFamily: 'Arial' });
    this.add.text(GW/2, GH-48, 'Flechas: Mover | ↑/Espacio: Saltar | Z: Atacar | Shift: Correr | P: Pausar', { fontSize: '9px', fill: '#666', fontFamily: 'Arial' }).setOrigin(0.5);
  },

  _showCtrls: function() {
    var bg = this.add.rectangle(GW/2, GH/2, 470, 270, 0x000000, 0.94).setDepth(10).setInteractive();
    var t  = this.add.text(GW/2, GH/2, [
      '─── CONTROLES ───', '',
      '← → : Moverse',
      '↑ / Espacio : Saltar',
      '↑ doble : Doble salto',
      'Shift : Correr  |  Z : Atacar',
      '↓ : Agacharse  |  P/Esc : Pausar',
      '', 'Cualquier tecla para cerrar'
    ].join('\n'), { fontSize: '15px', fill: '#FFD700', fontFamily: 'Arial', align: 'center', lineSpacing: 5 }).setOrigin(0.5).setDepth(11);
    var close = function() { bg.destroy(); t.destroy(); };
    bg.on('pointerdown', close);
    this.input.keyboard.once('keydown', close);
  }
});

// =============================================================
// HUD
// =============================================================
var HUD = new Phaser.Class({
  Extends: Phaser.Scene,
  initialize: function HUD() { Phaser.Scene.call(this, { key: 'HUD', active: false }); },

  create: function() {
    var S = { fontFamily: 'Arial Black', stroke: '#000', strokeThickness: 3 };
    this.livT  = this.add.text(8,    6,  '', Object.assign({}, S, { fontSize: '15px', fill: '#fff' }));
    this.scrT  = this.add.text(8,   25,  '', { fontSize: '11px', fill: '#FFD700', fontFamily: 'Arial' });
    this.lvlT  = this.add.text(GW/2, 6,  '', Object.assign({}, S, { fontSize: '13px', fill: '#fff' })).setOrigin(0.5, 0);
    this.coinT = this.add.text(GW-8, 6,  '', Object.assign({}, S, { fontSize: '15px', fill: '#FFD700' })).setOrigin(1, 0);
    this.add.text(GW/2, 25, 'EQUILIBRIO FISCAL', { fontSize: '9px', fill: '#FFD700', fontFamily: 'Arial' }).setOrigin(0.5, 0);
    this.fBg  = this.add.rectangle(GW/2,    41, 180, 10, 0x222222).setOrigin(0.5);
    this.fBar = this.add.rectangle(GW/2-90, 41, 180, 10, 0x00CC00).setOrigin(0, 0.5);
    this.puT  = this.add.text(8, 44, '', { fontSize: '10px', fill: '#00FFFF', fontFamily: 'Arial' });
    this.bBg  = this.add.rectangle(GW/2,      GH-20, 400, 14, 0x440000).setOrigin(0.5).setVisible(false);
    this.bBar = this.add.rectangle(GW/2-200,  GH-20, 400, 14, 0xFF2200).setOrigin(0, 0.5).setVisible(false);
    this.bNm  = this.add.text(GW/2, GH-35, '', Object.assign({}, S, { fontSize: '12px', fill: '#FF5555' })).setOrigin(0.5).setVisible(false);

    this.game.events.on('hud', function(d) {
      var gs = window.GS;
      this.livT.setText('🦁 x' + gs.lives);
      this.scrT.setText('SCORE: ' + gs.score);
      this.lvlT.setText(d.lvl || '');
      this.coinT.setText('$ ' + gs.coins);
      this.fBar.width = Math.max(0, (gs.fiscal / 100) * 180);
      this.fBar.fillColor = gs.fiscal > 60 ? 0x00CC00 : gs.fiscal > 30 ? 0xFFCC00 : 0xFF2200;
      this.puT.setText(d.pu ? '⚡ ' + d.pu : '');
      if (d.bhp != null) {
        this.bBg.setVisible(true); this.bBar.setVisible(true); this.bNm.setVisible(true);
        this.bNm.setText(d.bnm || '');
        this.bBar.width = Math.max(0, (d.bhp / d.bmx) * 400);
      } else {
        this.bBg.setVisible(false); this.bBar.setVisible(false); this.bNm.setVisible(false);
      }
    }, this);
  }
});

// =============================================================
// SHOP
// =============================================================
var Shop = new Phaser.Class({
  Extends: Phaser.Scene,
  initialize: function Shop() { Phaser.Scene.call(this, { key: 'Shop' }); },

  create: function() {
    var gs = window.GS;
    var scene = this;
    this.add.rectangle(GW/2, GH/2, GW, GH, 0x050505, 0.96);
    var espert = this.add.image(155, GH/2+20, 'ally_espert').setScale(0.55);
    this.tweens.add({ targets: espert, y: espert.y-10, duration: 900, yoyo: true, repeat: -1 });
    this.add.text(GW/2+45, 14, '🏪 LIBRE MERCADO SHOP', { fontSize: '22px', fill: '#FFD700', fontFamily: 'Arial Black', stroke: '#000', strokeThickness: 4 }).setOrigin(0.5, 0);
    this.mT = this.add.text(GW/2+45, 50, 'Monedas: $' + gs.coins, { fontSize: '15px', fill: '#00FF00', fontFamily: 'Arial' }).setOrigin(0.5, 0);
    this.chosen = null;

    var items = [
      { l: '🔧 Motosierra+', p: 50,  pu: 'chainsaw', d: 'Daño doble 20s' },
      { l: '📖 Libro Hayek',  p: 75,  pu: 'hayek',    d: 'Invencible 10s' },
      { l: '🦁 Peluca León',  p: 40,  pu: 'mane',     d: 'Velocidad x2'   },
      { l: '💰 Dolarito',     p: 60,  pu: 'shield',   d: 'Absorbe 3 golpes' },
      { l: '❤️ Vida extra',   p: 100, pu: 'life',     d: '+1 vida'         },
    ];
    var quotes = ['"¡Excelente inversión!"', '"El mercado tiene razón"', '"¡Comprá antes que se infle!"', '"Puro libre mercado"'];

    for (var i = 0; i < items.length; i++) {
      (function(it) {
        var by  = 95 + items.indexOf(it) * 52;
        var ok  = gs.coins >= it.p;
        var btn = scene.add.rectangle(GW/2+45, by, 330, 44, ok ? 0x143014 : 0x1a1a1a).setInteractive().setOrigin(0.5);
        scene.add.text(GW/2+45-145, by, it.l, { fontSize: '14px', fill: ok ? '#FFD700' : '#555', fontFamily: 'Arial Black' }).setOrigin(0, 0.5);
        scene.add.text(GW/2+45+110, by-9, '$'+it.p, { fontSize: '13px', fill: ok ? '#00FF00' : '#444', fontFamily: 'Arial' }).setOrigin(0.5);
        scene.add.text(GW/2+45+110, by+9, it.d, { fontSize: '10px', fill: '#888', fontFamily: 'Arial' }).setOrigin(0.5);
        if (ok) {
          btn.on('pointerover',  function() { btn.setFillStyle(0x1d551d); });
          btn.on('pointerout',   function() { btn.setFillStyle(0x143014); });
          btn.on('pointerdown',  function() {
            gs.coins -= it.p; scene.chosen = it.pu;
            scene.mT.setText('Monedas: $' + gs.coins);
            btn.setFillStyle(0x003300);
            var qt = scene.add.text(GW/2+45, GH-42, quotes[Math.floor(Math.random()*quotes.length)], { fontSize: '12px', fill: '#fff', fontFamily: 'Arial', fontStyle: 'italic' }).setOrigin(0.5).setDepth(5);
            scene.time.delayedCall(2200, function() { qt.destroy(); });
          });
        }
      })(items[i]);
    }

    var cont = this.add.text(GW/2+45, GH-14, '▶ CONTINUAR →', { fontSize: '16px', fill: '#FFD700', fontFamily: 'Arial Black', stroke: '#000', strokeThickness: 3 }).setOrigin(0.5).setInteractive();
    cont.on('pointerover',  function() { cont.setFill('#FFA500'); });
    cont.on('pointerout',   function() { cont.setFill('#FFD700'); });
    cont.on('pointerdown',  function() { scene._go(); });
    this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.ENTER).on('down', function() { scene._go(); });
  },

  _go: function() {
    window.GS.pendingPU = this.chosen;
    this.scene.stop('HUD');
    this.scene.start('Game');
  }
});

// GAME
// =============================================================
var Game = new Phaser.Class({
  Extends: Phaser.Scene,
  initialize: function Game() { Phaser.Scene.call(this, { key: 'Game' }); },

  create: function() {
    var gs = window.GS;
    var lv = LEVELS[gs.level] || LEVELS[0];
    this.lv = lv;

    // State
    this.attacking   = false;
    this.invincible  = false;
    this.chainsawOn  = false;
    this.activePU    = null;
    this.combo       = 0;
    this.bossSpawned = false;
    this.allyGiven   = false;
    this.bossRef     = null;
    this.bossHP      = lv.hp;
    this.bossMaxHP   = lv.hp;
    this.done        = false;
    this.paused      = false;
    this.pauseUI     = null;
    this.bossTimer   = null;

    var WW = 5000;
    if (gs.pendingPU) { this._applyPU(gs.pendingPU); gs.pendingPU = null; }

    // Physics world
    this.physics.world.setBounds(0, 0, WW, GH);
    this.physics.world.gravity.y = GRAV;

    // Background
    this.add.image(0, 0, lv.bg).setOrigin(0, 0).setDisplaySize(WW, GH);

    // Platforms
    this.platGrp = this.physics.add.staticGroup();
    this._buildWorld(WW);

    // ── PLAYER ──
    // NOTE: We do NOT chain physics methods. Each call on its own line.
    this.player = this.physics.add.sprite(130, GH-140, 'milei');
    this.player.setScale(0.28);  // frame=347px, 0.28 scale = ~97px player height
    this.player.setCollideWorldBounds(true);
    this.player.setDragX(DRAG);
    this.player.setDepth(10);
    // Cap velocity manually in update() — avoids any setMaxVelocityX issues
    this.maxVX = RUN; // current max, changes with powerup
    this.player.facing = 1;
    this.player.isDead = false;
    this.player.djUsed = false;
    try { this.player.play('m_idle'); } catch(e) {}

    // Camera
    this.cameras.main.setBounds(0, 0, WW, GH);
    this.cameras.main.startFollow(this.player, true, 0.09, 0.09);
    this.cameras.main.setDeadzone(100, 50);

    // Groups
    this.enemies  = this.physics.add.group();
    this.coinGrp  = this.physics.add.group();
    this.puGrp    = this.physics.add.group();
    this.projGrp  = this.physics.add.group();

    this._spawnEnemies(WW);
    this._spawnCoins(WW);
    this._spawnPUs(WW);

    // Colliders
    var self = this;
    this.physics.add.collider(this.player,  this.platGrp);
    this.physics.add.collider(this.enemies, this.platGrp);
    this.physics.add.collider(this.coinGrp, this.platGrp);
    this.physics.add.collider(this.puGrp,   this.platGrp);
    this.physics.add.collider(this.projGrp, this.platGrp, function(pr) { pr.destroy(); });
    this.physics.add.overlap(this.player, this.enemies,  function(pl, e)  { self._onEnemy(pl, e);  });
    this.physics.add.overlap(this.player, this.coinGrp,  function(pl, c)  { self._onCoin(pl, c);   });
    this.physics.add.overlap(this.player, this.puGrp,    function(pl, pu) { self._onPU(pl, pu);    });
    this.physics.add.overlap(this.player, this.projGrp,  function(pl, pr) { pr.destroy(); if (!self.invincible) self._damage(); });

    // Trigger X
    this.allyTrigX = WW / 2;
    this.bossTrigX = WW - 900;

    // Controls
    var KC = Phaser.Input.Keyboard.KeyCodes;
    this.kL  = this.input.keyboard.addKey(KC.LEFT);
    this.kR  = this.input.keyboard.addKey(KC.RIGHT);
    this.kD  = this.input.keyboard.addKey(KC.DOWN);
    this.kSh = this.input.keyboard.addKey(KC.SHIFT);
    this.input.keyboard.addKey(KC.UP).on('down',    function() { self._jump(); });
    this.input.keyboard.addKey(KC.SPACE).on('down', function() { self._jump(); });
    this.input.keyboard.addKey('Z').on('down',       function() { self._attack(); });
    this.input.keyboard.addKey('P').on('down',       function() { self._pause(); });
    this.input.keyboard.addKey(KC.ESC).on('down',   function() { self._pause(); });

    // HUD
    this.scene.launch('HUD');
    this._hud();

    // Audio - null-safe initialization
    try { this.sZ = this.sound.add('snd_z', { volume: 0.9 }); } catch(e) { this.sZ = null; }
    try { this.sV = this.sound.add('snd_v', { volume: 0.9 }); } catch(e) { this.sV = null; }
    try { this.sC = this.sound.add('snd_c', { volume: 0.9 }); } catch(e) { this.sC = null; }

    // Fiscal decay
    var scene = this;
    this.time.addEvent({ delay: 5000, loop: true, callback: function() {
      if (!scene.done && !scene.paused) {
        gs.fiscal = Math.max(0, gs.fiscal - 2);
        if (gs.fiscal <= 0) scene._damage();
        scene._hud();
      }
    }});

    this.time.delayedCall(25000, function() { scene._macri(); });
    this._banner('MUNDO ' + (gs.level+1) + '\n' + lv.name, '#FFD700', 2500);
  },

  _buildWorld: function(WW) {
    this._plat(WW/2, GH-16, WW, 32, 0x5C3A1E);
    var L = [350,305,150, 600,235,120, 880,315,100, 1150,255,130, 1420,325,110,
             1680,195,140, 1950,275,120, 2220,335,100, 2490,245,130, 2760,305,100,
             3030,215,140, 3300,355,110, 3570,265,120, 3840,235,100, 4110,305,130,
             4380,195,110, 4650,325,120];
    for (var i = 0; i < L.length; i += 3) this._plat(L[i], L[i+1], L[i+2], 14, 0x7B4F2E);
  },

  _plat: function(x, y, w, h, col) {
    var g = this.add.graphics();
    g.fillStyle(col, 1);           g.fillRect(x-w/2, y-h/2, w, h);
    g.fillStyle(col + 0x222222, 1); g.fillRect(x-w/2, y-h/2, w, 4);
    var b = this.platGrp.create(x, y, 'px');
    b.setDisplaySize(w, h).setAlpha(0).refreshBody();
  },

  _spawnEnemies: function(WW) {
    var ckPos = [420,770,1120,1520,1870,2270,2620,3020,3370,3770,4170,4570];
    for (var i=0; i<ckPos.length; i++) this._mkE('cuca_k', ckPos[i], GH-78, 1, 'ck_walk', 62);
    var caPos = [1080,2380,3680];
    for (var i=0; i<caPos.length; i++) this._mkE('cuca_arm', caPos[i], GH-78, 2, 'ca_walk', 45);
    var siPos = [1680,3180,4480];
    for (var i=0; i<siPos.length; i++) this._mkE('sind', siPos[i], GH-83, 3, 'si_walk', 32);
  },

  _mkE: function(tex, x, y, hp, anim, spd) {
    var e = this.physics.add.sprite(x, y, tex);
    var scl = tex==='sind' ? 0.28 : tex==='cuca_arm' ? 0.2 : 0.35; e.setScale(scl);
    e.setCollideWorldBounds(true);
    e.setVelocityX(-spd);
    e.setDepth(5);
    e.hp = hp; e.spd = spd; e.tex = tex; e.isDead = false; e._dir = -1;
    try { e.play(anim); } catch(err) {}
    this.enemies.add(e);
  },

  _spawnCoins: function(WW) {
    for (var x = 300; x < WW-300; x += 165) {
      if (Math.random() > 0.4) {
        var c = this.physics.add.sprite(x, GH-148 - Math.random()*75, 'pups');
        c.setFrame(0).setScale(0.07); c.body.setGravityY(-GRAV + 120);
        this.coinGrp.add(c);
      }
    }
  },

  _spawnPUs: function(WW) {
    var types = ['dollar','chainsaw','shield','hayek','mane'];
    var xArr  = [700, 1600, 2500, 3400, 4300];
    for (var i = 0; i < xArr.length; i++) {
      var pu = this.physics.add.sprite(xArr[i], GH-200, 'pups');
      pu.setScale(0.08).setBounce(0.35);
      pu.puType = types[i % 5];
      var puFrames={'dollar':0,'chainsaw':1,'hayek':2,'mane':3,'shield':4}; pu.setFrame(puFrames[pu.puType]||0);
      this.puGrp.add(pu);
    }
  },

  _jump: function() {
    if (this.paused || this.player.isDead) return;
    var onG = this.player.body.blocked.down;
    if (onG) {
      this.player.setVelocityY(JUMP_V);
      this.player.djUsed = false;
    } else if (!this.player.djUsed) {
      this.player.setVelocityY(DJUMP);
      this.player.djUsed = true;
      this.cameras.main.shake(65, 0.004);
      this._float(this.player.x, this.player.y+20, '✨', '#FFD700', 380);
    }
  },

  _attack: function() {
    if (this.paused || this.attacking || this.player.isDead) return;
    this.attacking = true;
    try { this.player.play('m_atk', true); } catch(e) {}
    if (this.chainsawOn && !this.sZ.isPlaying) this.sZ.play();

    var dir = this.player.facing;
    var hr  = new Phaser.Geom.Rectangle(this.player.x + dir*30 - 40, this.player.y - 42, 80, 84);
    var self = this;

    this.enemies.getChildren().forEach(function(e) {
      if (e.active && !e.isDead && Phaser.Geom.Intersects.RectangleToRectangle(hr, e.getBounds()))
        self._hitE(e);
    });
    if (this.bossRef && this.bossRef.active && !this.bossRef.isDead &&
        Phaser.Geom.Intersects.RectangleToRectangle(hr, this.bossRef.getBounds()))
      this._hitBoss();

    var fl = this.add.rectangle(this.player.x + dir*50, this.player.y, 84, 70, 0xFFFF00, 0.2).setDepth(20);
    this.time.delayedCall(80, function() { fl.destroy(); });
    this.time.delayedCall(350, function() {
      self.attacking = false;
      if (!self.player.isDead) try { self.player.play('m_idle', true); } catch(e) {}
    });
  },

  _hitE: function(e) {
    var dmg = this.chainsawOn ? 2 : 1;
    e.hp -= dmg;
    this.cameras.main.shake(85, 0.005);
    this.tweens.add({ targets: e, tint: 0xFF0000, duration: 80, yoyo: true });
    this._float(e.x, e.y-20, '-' + dmg, '#FF4444');
    if (e.hp <= 0) this._killE(e);
    else if (e.tex === 'cuca_arm') {
      try { e.play('ca_hit', true); } catch(err) {}
      var self = this;
      this.time.delayedCall(400, function() { if (e.active) try { e.play('ca_walk', true); } catch(err) {} });
    }
  },

  _killE: function(e) {
    if (e.isDead) return;
    e.isDead = true;
    e.setVelocity(0, -105).setDepth(3);
    var da = { cuca_k: 'ck_die', cuca_arm: 'ca_die', sind: 'si_die' }[e.tex] || 'ck_die';
    try { e.play(da, true); } catch(err) {}
    window.GS.coins  += 5;
    window.GS.score  += 100;
    window.GS.fiscal  = Math.min(100, window.GS.fiscal + 3);
    this._float(e.x, e.y-20, '+$5', '#FFD700');
    this.combo++;
    if (this.combo >= 5) {
      this._banner('¡COMBO x5!\n¡AFUERA!', '#FFD700', 1500);
      if (this.sV && !this.sV.isPlaying) try{this.sV.play();}catch(e){}
      this.combo = 0;
    }
    var self = this;
    this.time.delayedCall(750, function() { if (e.active) e.destroy(); });
    this._hud();
  },

  _onEnemy: function(pl, e) {
    if (this.invincible || pl.isDead || e.isDead) return;
    if (pl.body.velocity.y > 60 && pl.y < e.y - 18) {
      this._hitE(e);
      pl.setVelocityY(JUMP_V * 0.45);
    } else {
      this._damage();
    }
  },

  _onCoin: function(pl, c) {
    c.destroy();
    window.GS.coins++;
    window.GS.score  += 10;
    window.GS.fiscal  = Math.min(100, window.GS.fiscal + 1);
    this._float(c.x, c.y, '+$1', '#FFD700', 500);
    this._hud();
  },

  _onPU: function(pl, pu) {
    var t = pu.puType;
    pu.destroy();
    this.cameras.main.flash(200, 255, 210, 0);
    this._applyPU(t);
  },

  _applyPU: function(type) {
    var L = { dollar:'Motosierra', chainsaw:'Motosierra MAX', shield:'Escudo $', hayek:'Modo Hayek', mane:'Peluca León', life:'Vida Extra' };
    this.activePU = L[type] || type;
    var self = this;
    switch (type) {
      case 'dollar':
      case 'chainsaw':
        this.chainsawOn = true;
        if (this.sZ && !this.sZ.isPlaying) try{this.sZ.play();}catch(e){}
        this._banner('¡MOTOSIERRA!\n¡Zurdos tiemblen!', '#FFD700', 2000);
        this.time.delayedCall(type === 'chainsaw' ? 20000 : 15000, function() { self.chainsawOn = false; self.activePU = null; self._hud(); });
        break;
      case 'shield':
        this.invincible = true;
        this._banner('¡DOLARITO ESCUDO!\n¡INVENCIBLE!', '#00FFFF', 2000);
        this.time.delayedCall(15000, function() { self.invincible = false; self.activePU = null; self._hud(); });
        break;
      case 'hayek':
        this.invincible = true;
        this._banner('¡LIBRO DE HAYEK!\n¡LIBERTAD!', '#FFF', 2000);
        this.time.delayedCall(10000, function() { self.invincible = false; self.activePU = null; self._hud(); });
        break;
      case 'mane':
        this.maxVX = RUN * 1.9;
        this._banner('¡PELUCA DE LEÓN!\n¡VELOCIDAD MAX!', '#DAA520', 2000);
        this.time.delayedCall(10000, function() { self.maxVX = RUN; self.activePU = null; self._hud(); });
        break;
      case 'life':
        window.GS.lives++;
        this._banner('¡VIDA EXTRA!', '#FF69B4', 1500);
        break;
    }
    this._hud();
  },

  _spawnAlly: function() {
    var cfg  = this.lv;
    var ax   = this.player.x + 420;
    var ally = this.add.image(ax, GH-155, cfg.ally).setScale(0.15).setAlpha(0).setDepth(8);
    var self = this;
    this.tweens.add({ targets: ally, alpha: 1, duration: 800 });
    this.tweens.add({ targets: ally, y: ally.y-12, duration: 900, yoyo: true, repeat: -1, ease: 'Sine.easeInOut', delay: 800 });
    var lbl = this.add.text(ax, GH-255, '✨ ' + cfg.an + ' ✨\n¡Tócalo!', { fontSize:'12px', fill:'#FFD700', fontFamily:'Arial', align:'center', backgroundColor:'#000000AA', padding:{x:5,y:2} }).setOrigin(0.5).setDepth(9);

    this.physics.world.enable(ally);
    ally.body.allowGravity = false;
    var ov = this.physics.add.overlap(this.player, ally, function() {
      self.physics.world.removeCollider(ov);
      lbl.destroy();
      self.cameras.main.flash(300, 255, 215, 0);
      var M = { ally_alberdi:'shield', ally_cavallo:'dollar', ally_sarmiento:'hayek', ally_nisman:'chainsaw', ally_adam:'dollar', ally_sanmartin:'chainsaw', ally_friedman:'shield', ally_hayek:'chainsaw' };
      self._applyPU(M[cfg.ally] || 'shield');
      var Q = { ally_alberdi:'"La Constitución es el escudo"', ally_nisman:'"La verdad sale a la luz"', ally_cavallo:'"Un peso, un dólar"', ally_sarmiento:'"¡Educar al soberano!"', ally_adam:'"The invisible hand"', ally_sanmartin:'"Seamos libres"', ally_friedman:'"No free lunch"', ally_hayek:'"The road to serfdom"' };
      self._banner(Q[cfg.ally] || '¡Poder!', '#FFD700', 2500);
      self.tweens.add({ targets: ally, alpha: 0, duration: 600, onComplete: function() { ally.destroy(); } });
    });
    this.time.delayedCall(9000, function() {
      if (ally.active) {
        lbl.destroy();
        self.tweens.add({ targets: ally, alpha: 0, duration: 700, onComplete: function() { ally.destroy(); } });
      }
    });
  },

  _launchBoss: function() {
    var self = this;
    this.cameras.main.shake(450, 0.016);
    this._banner('⚠ BOSS ⚠\n' + this.lv.bn, '#FF0000', 3000);
    this.time.delayedCall(2200, function() {
      var bx = self.cameras.main.scrollX + GW - 80;
      var bk = self.lv.bk;
      var ba = self.lv.ba;
      self.bossRef = self.physics.add.sprite(bx, GH-145, bk);
      self.bossRef.setScale(bk === 'boss_fmi' ? 0.4 : 0.32);
      self.bossRef.setCollideWorldBounds(true);
      self.bossRef.setDepth(8);
      self.bossRef.isDead = false;
      self.bossRef.hp     = self.bossHP;
      try { self.bossRef.play(ba + '_idle', true); } catch(e) {}
      self.physics.add.collider(self.bossRef, self.platGrp);
      self.physics.add.overlap(self.player, self.bossRef, function() {
        if (!self.invincible && !self.bossRef.isDead && !self.player.isDead) self._damage();
      });
      self.bossTimer = self.time.addEvent({ delay: 1700, loop: true, callback: function() { self._bossAI(); } });
      self._hud();
    });
  },

  _bossAI: function() {
    var b = this.bossRef, ba = this.lv.ba;
    if (!b || !b.active || b.isDead || this.player.isDead) return;
    var dx  = this.player.x - b.x;
    var spd = 62 + window.GS.level * 7;
    var self = this;
    b.setVelocityX(dx > 0 ? spd : -spd);
    b.setFlipX(dx < 0);
    var r = Math.random();
    if (r < 0.28 && b.body.blocked.down) {
      b.setVelocityY(JUMP_V * 0.7);
    } else if (r < 0.55) {
      try { b.play(ba + '_atk', true); } catch(e) {}
      this.time.delayedCall(280, function() { if (b && b.active) self._proj(b.x + (dx>0?50:-50), b.y, dx>0?210:-210, -85); });
    } else if (r < 0.72 && Math.abs(dx) < 380) {
      b.setVelocityX(dx > 0 ? spd*2.2 : -spd*2.2);
    } else {
      this._mkE('cuca_k', b.x + Phaser.Math.Between(-200, 200), GH-78, 1, 'ck_walk', 65);
      this._float(b.x, b.y-60, '¡REFUERZOS!', '#FF0000');
    }
    this.time.delayedCall(550, function() {
      if (b && b.active && !b.isDead) try { b.play(ba + '_idle', true); } catch(e) {}
    });
  },

  _proj: function(x, y, vx, vy) {
    var pr = this.add.rectangle(x, y, 22, 12, 0xFF2200).setDepth(12);
    this.physics.add.existing(pr);
    pr.body.setVelocity(vx, vy);
    this.projGrp.add(pr);
    this.time.delayedCall(3500, function() { if (pr.active) pr.destroy(); });
  },

  _hitBoss: function() {
    if (!this.bossRef || this.bossRef.isDead) return;
    var dmg = this.chainsawOn ? 18 : 10;
    this.bossRef.hp -= dmg;
    this.bossHP      = this.bossRef.hp;
    this.cameras.main.shake(150, 0.01);
    this.tweens.add({ targets: this.bossRef, tint: 0xFF0000, duration: 110, yoyo: true });
    this._float(this.bossRef.x, this.bossRef.y-40, '-' + dmg, '#FF0000');
    window.GS.score += 50;
    if (this.bossRef.hp <= 0) this._bossDie();
    this._hud();
  },

  _bossDie: function() {
    if (this.bossRef.isDead) return;
    this.bossRef.isDead = true;
    if (this.bossTimer) this.bossTimer.remove();
    try { this.bossRef.play(this.lv.ba + '_die', true); } catch(e) {}
    this.cameras.main.shake(650, 0.02);
    var Q = { del_cano:'"¡El pueblo unido!"', massa:'"Yo siempre estuve en contra"', kicillof:'"La culpa es de Milei"', cristina:'"¡Me persiguen!"', larreta:'"Esto es lo que siempre quise"', villarruel:'"Sirvo a la patria"', moreno:'"¡TE VOY A ROMPER!"', boss_fmi:'"¡VIVA LA CASTA!"' };
    this._banner(Q[this.lv.bk] || '"¡Derrotado!"', '#FF6600', 3000);
    var self = this;
    this.time.delayedCall(3200, function() {
      self.done = true; self.bossHP = 0;
      var gs = window.GS;
      gs.score  += 1000;
      gs.fiscal  = Math.min(100, gs.fiscal + 20);
      gs.coins  += 20;
      if (gs.level >= LEVELS.length - 1) {
        self._banner('🏆 ¡JUEGO COMPLETADO!\n¡VIVA LA LIBERTAD CARAJO!', '#FFD700', 6000);
        if (self.sC) try{self.sC.play();}catch(e){}
        self.time.delayedCall(7000, function() { try{self.scene.stop('HUD');}catch(e){} try{self.scene.start('Title');}catch(e){window.location.reload();} });
      } else {
        self._banner('¡NIVEL COMPLETADO!\n¡LIBERTAD!', '#FFD700', 2500);
        if (self.sV && !self.sV.isPlaying) try{self.sV.play();}catch(e){}
        self.time.delayedCall(3200, function() { gs.level++; self.scene.stop('HUD'); self.scene.start('Shop'); });
      }
    });
  },

  _damage: function() {
    if (this.invincible || this.player.isDead) return;
    window.GS.lives--;
    this.invincible = true;
    try { this.player.play('m_hit', true); } catch(e) {}
    this.cameras.main.shake(200, 0.015);
    var self = this;
    this.tweens.add({ targets: this.player, alpha: 0.3, duration: 80, yoyo: true, repeat: 13, onComplete: function() {
      self.invincible = false;
      self.player.alpha = 1;
      if (!self.player.isDead) try { self.player.play('m_idle', true); } catch(e) {}
    }});
    if (window.GS.lives <= 0) this._die();
    this._hud();
  },

  _die: function() {
    if (this.player.isDead) return;
    this.player.isDead = true;
    try { this.player.play('m_die', true); } catch(e) {}
    this.player.setVelocity(0, -255);
    this._banner('GAME OVER\n"El camino es duro pero vale la pena"', '#FF0000', 4000);
    var self = this;
    this.time.delayedCall(5000, function() {
      window.GS = { lives:3, coins:0, fiscal:50, level:0, score:0, pendingPU:null };
      try { self.scene.stop('HUD'); } catch(e) {}
      try {
        self.scene.stop('Game');
        self.scene.start('Title');
      } catch(e) { window.location.reload(); }
    });
  },

  _macri: function() {
    var self = this;
    var mx   = this.player.x + 480;
    var mg   = this.add.sprite(mx, GH-72, 'macri').setScale(0.3).setDepth(9);
    try { mg.play('mg_idle'); } catch(e) {}
    var mt = this.add.text(mx, GH-132, '¡MIAU!', { fontSize:'16px', fill:'#FFD700', fontFamily:'Arial Black', stroke:'#000', strokeThickness:3 }).setOrigin(0.5).setDepth(10);
    this.physics.world.enable(mg);
    mg.body.allowGravity = false;
    var ov = this.physics.add.overlap(this.player, mg, function() {
      self.physics.world.removeCollider(ov);
      mt.destroy();
      var good = Math.random() > 0.45;
      if (good) {
        try { mg.play('mg_good', true); } catch(e) {}
        window.GS.coins  += 20;
        window.GS.fiscal  = Math.min(100, window.GS.fiscal + 20);
        self.invincible   = true;
        self.time.delayedCall(12000, function() { self.invincible = false; });
        self._banner('¡MACRI PREMIO!\n+20 monedas + escudo', '#00FF00', 2000);
      } else {
        try { mg.play('mg_bad', true); } catch(e) {}
        window.GS.coins  = Math.max(0, window.GS.coins - 10);
        window.GS.fiscal = Math.max(0, window.GS.fiscal - 15);
        self._banner('¡SORPRESA MACRI!\n-10 monedas\n"No sabíamos lo que había"', '#FF6600', 2000);
      }
      self.time.delayedCall(1500, function() {
        try { mg.play('mg_exit', true); } catch(e) {}
        self.tweens.add({ targets: mg, x: mg.x+280, alpha: 0, duration: 900, onComplete: function() { mg.destroy(); } });
      });
      self._hud();
    });
    this.time.delayedCall(9000, function() {
      if (mg.active) {
        mt.destroy();
        self.tweens.add({ targets: mg, alpha: 0, duration: 700, onComplete: function() { mg.destroy(); } });
      }
    });
  },

  _pause: function() {
    this.paused = !this.paused;
    var sx = this.cameras.main.scrollX;
    if (this.paused) {
      this.physics.pause();
      var bg = this.add.rectangle(GW/2+sx, GH/2, 400, 190, 0x000000, 0.92).setDepth(100);
      var t1 = this.add.text(GW/2+sx, GH/2-50, '⏸ PAUSADO', { fontSize:'28px', fill:'#FFD700', fontFamily:'Arial Black', stroke:'#000', strokeThickness:5 }).setOrigin(0.5).setDepth(101);
      var t2 = this.add.text(GW/2+sx, GH/2-8,  'P / ESC → Continuar', { fontSize:'16px', fill:'#fff', fontFamily:'Arial' }).setOrigin(0.5).setDepth(101);
      var t3 = this.add.text(GW/2+sx, GH/2+22, 'Vidas: '+window.GS.lives+' | $'+window.GS.coins+' | Score: '+window.GS.score, { fontSize:'13px', fill:'#FFD700', fontFamily:'Arial' }).setOrigin(0.5).setDepth(101);
      this.pauseUI = [bg, t1, t2, t3];
    } else {
      this.physics.resume();
      if (this.pauseUI) { this.pauseUI.forEach(function(o) { o.destroy(); }); this.pauseUI = null; }
    }
  },

  _hud: function() {
    this.game.events.emit('hud', {
      lvl: 'MUNDO ' + (window.GS.level+1) + ' - ' + this.lv.name,
      pu:  this.activePU,
      bhp: this.bossRef && !this.bossRef.isDead ? this.bossHP : null,
      bmx: this.bossMaxHP,
      bnm: this.lv.bn
    });
  },

  _banner: function(txt, col, dur) {
    var sx = this.cameras.main.scrollX;
    var bg = this.add.rectangle(GW/2+sx, GH/2, 510, 90, 0x000000, 0.88).setDepth(60);
    var t  = this.add.text(GW/2+sx, GH/2, txt, { fontSize:'21px', fill:col, fontFamily:'Arial Black', stroke:'#000', strokeThickness:5, align:'center' }).setOrigin(0.5).setDepth(61);
    this.tweens.add({ targets: [bg, t], alpha: 0, duration: dur, onComplete: function() { bg.destroy(); t.destroy(); } });
  },

  _float: function(x, y, txt, col, dur) {
    dur = dur || 700;
    var t = this.add.text(x, y, txt, { fontSize:'14px', fill:col, fontFamily:'Arial Black', stroke:'#000', strokeThickness:3 }).setOrigin(0.5).setDepth(55);
    this.tweens.add({ targets: t, y: y-48, alpha: 0, duration: dur, onComplete: function() { t.destroy(); } });
  },

  update: function() {
    if (this.paused || !this.player || this.player.isDead) return;

    var dt  = this.game.loop.delta / 1000;
    var onG = this.player.body.blocked.down;
    var vx  = this.player.body.velocity.x;
    var run = this.kSh.isDown;
    var maxS = run ? this.maxVX : Math.min(this.maxVX, WALK);

    // Horizontal movement - NES gradual accel/decel
    if (this.kL.isDown) {
      this.player.facing = -1;
      this.player.setFlipX(true);
      vx = Math.max(vx - ACCEL * dt, -maxS);
      this.player.body.velocity.x = vx;
    } else if (this.kR.isDown) {
      this.player.facing = 1;
      this.player.setFlipX(false);
      vx = Math.min(vx + ACCEL * dt, maxS);
      this.player.body.velocity.x = vx;
    } else {
      if (Math.abs(vx) < 5) {
        this.player.body.velocity.x = 0;
      } else {
        this.player.body.velocity.x -= Math.sign(vx) * DRAG * dt;
      }
    }

    // Hard cap velocity (replaces setMaxVelocityX)
    if (this.player.body.velocity.x >  maxS) this.player.body.velocity.x =  maxS;
    if (this.player.body.velocity.x < -maxS) this.player.body.velocity.x = -maxS;

    // Duck
    var scaleY = (this.kD.isDown && onG) ? 0.20 : 0.28; this.player.setScale(0.28, scaleY);

    // Animations
    if (!this.attacking) {
      try {
        if (!onG)                                  this.player.play('m_jump', true);
        else if (Math.abs(this.player.body.velocity.x) > 8) this.player.play('m_walk', true);
        else                                       this.player.play('m_idle', true);
      } catch(e) {}
    }

    if (onG) this.player.djUsed = false;

    // Enemy AI
    var self = this;
    this.enemies.getChildren().forEach(function(e) {
      if (!e.active || e.isDead) return;
      var dx = e.x - self.player.x;
      if (Math.abs(dx) < 500) {
        e.setVelocityX(dx > 0 ? -e.spd : e.spd);
        e.setFlipX(dx > 0);
      } else {
        if (e.body.blocked.right || e.body.blocked.left) e._dir *= -1;
        if (!e._dir) e._dir = -1;
        e.setVelocityX(e._dir * e.spd * 0.55);
        e.setFlipX(e._dir < 0);
      }
      if ((e.body.blocked.right || e.body.blocked.left) && e.body.blocked.down) e.setVelocityY(JUMP_V * 0.48);
    });

    // Boss facing
    if (this.bossRef && this.bossRef.active && !this.bossRef.isDead)
      this.bossRef.setFlipX(this.player.x < this.bossRef.x);

    // Cleanup projectiles
    this.projGrp.getChildren().forEach(function(pr) {
      if (pr.y > GH+40 || pr.x < -50 || pr.x > 6000) pr.destroy();
    });

    // Fall death
    if (this.player.y > GH + 40) this._die();

    // Position triggers
    if (!this.allyGiven   && this.player.x > this.allyTrigX) { this.allyGiven   = true; this._spawnAlly();  }
    if (!this.bossSpawned && this.player.x > this.bossTrigX) { this.bossSpawned = true; this._launchBoss(); }

    // HUD periodic
    if (this.game.loop.frame % 10 === 0) this._hud();
  }
});

// =============================================================
// START
// =============================================================
new Phaser.Game({
  type:   Phaser.AUTO,
  width:  GW,
  height: GH,
  backgroundColor: '#0a0a1a',
  physics: { default: 'arcade', arcade: { gravity: { y: 0 }, debug: false } },
  scene:  [Boot, Title, HUD, Shop, Game],
  scale:  { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH }
});

</script>
</body>
