<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Milei Bros</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden}
canvas{display:block;image-rendering:pixelated}
#load{position:fixed;top:0;left:0;width:100%;height:100%;background:#0a0a1a;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:9999;color:#FFD700;font-family:'Arial Black',Arial,sans-serif}
#load h1{font-size:52px;text-shadow:0 0 30px #FFD700;margin-bottom:10px;letter-spacing:4px}
#load p{color:#aaa;margin-bottom:20px;font-size:15px}
#pb-c{width:380px;height:18px;background:#222;border:2px solid #FFD700;border-radius:4px;overflow:hidden}
#pb{height:100%;background:linear-gradient(90deg,#FFD700,#FF8C00);width:0%;transition:width .1s}
#pct{margin-top:8px;font-size:13px;color:#FFD700}
#slogan{margin-top:24px;font-size:22px;color:#fff;font-style:italic;animation:blink 1.5s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>
<body>
<div id="load">
  <h1>⚡ MILEI BROS ⚡</h1>
  <p>Cargando assets...</p>
  <div id="pb-c"><div id="pb"></div></div>
  <div id="pct">0%</div>
  <div id="slogan">¡VIVA LA LIBERTAD, CARAJO!</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.60.0/phaser.min.js"></script>
<script>
'use strict';

const BASE   = 'https://albertoezequielhernandez-prog.github.io/sprite-Milei-Bros/';
const GW=800, GH=450;

// NES Mario physics (px/s)
const WALK=90, RUN=150, ACCEL=600, DRAG=700;
const JUMP_V=-500, DJUMP_V=-370;

window.GS = { lives:3, coins:0, fiscal:50, level:0, score:0, pendingPU:null };

const LEVELS=[
  {bg:'bg_casa', name:'CASA ROSADA',   boss:'del_cano',   bossName:'NICO DEL CAÑO',    ally:'ally_alberdi',  allyName:'ALBERDI',    bossHP:100},
  {bg:'bg_cong', name:'EL CONGRESO',   boss:'massa',      bossName:'EL PANQUEQUE',      ally:'ally_cavallo',  allyName:'CAVALLO',    bossHP:120},
  {bg:'bg_pan',  name:'EL PANTANO',    boss:'kicillof',   bossName:'KICILLOF',          ally:'ally_sarmiento',allyName:'SARMIENTO',  bossHP:130},
  {bg:'bg_como', name:'COMODORO PY',   boss:'alberto',    bossName:'ALBERTO MARIONETA', ally:'ally_alberdi',  allyName:'ALBERDI',    bossHP:90},
  {bg:'bg_como', name:'COMODORO PY II',boss:'cristina',   bossName:'CFK',               ally:'ally_nisman',   allyName:'NISMAN',     bossHP:150},
  {bg:'bg_banco',name:'BANCO CENTRAL', boss:'larreta',    bossName:'EL REPTILIANO',     ally:'ally_adam',     allyName:'ADAM SMITH', bossHP:140},
  {bg:'bg_senado',name:'EL SENADO',    boss:'villarruel', bossName:'LA KUKARRUEL',      ally:'ally_sanmartin',allyName:'SAN MARTÍN', bossHP:160},
  {bg:'bg_afip', name:'LA AFIP',       boss:'moreno',     bossName:'MORENO',            ally:'ally_friedman', allyName:'FRIEDMAN',   bossHP:180},
  {bg:'bg_fmi',  name:'EL FMI',        boss:'boss_fmi',   bossName:'LA CASTA SUPREMA',  ally:'ally_hayek',    allyName:'HAYEK',      bossHP:300},
];

// ═══════════════════════════════════════
// BOOT
// ═══════════════════════════════════════
class Boot extends Phaser.Scene {
  constructor(){ super('Boot'); }

  preload(){
    const pb  = document.getElementById('pb');
    const pct = document.getElementById('pct');
    this.load.on('progress', v => { pb.style.width=(v*100)+'%'; pct.textContent=Math.floor(v*100)+'%'; });
    this.load.on('complete', () => { document.getElementById('load').style.display='none'; });

    // Backgrounds
    this.load.image('bg_casa',   BASE+'assets/backgrounds/Casa%20rosada.png');
    this.load.image('bg_cong',   BASE+'assets/backgrounds/Congreso.png');
    this.load.image('bg_pan',    BASE+'assets/backgrounds/pantano.png');
    this.load.image('bg_como',   BASE+'assets/backgrounds/Comodoro%20py.png');
    this.load.image('bg_banco',  BASE+'assets/backgrounds/banco%20central.png');
    this.load.image('bg_senado', BASE+'assets/backgrounds/senado.png');
    this.load.image('bg_afip',   BASE+'assets/backgrounds/AFIP.png');
    this.load.image('bg_fmi',    BASE+'assets/backgrounds/FMI.png');

    // Allies (static images)
    this.load.image('ally_alberdi',   BASE+'assets/allies/sprite%20alberdi%20optimizado.png');
    this.load.image('ally_nisman',    BASE+'assets/allies/sprite%20nismann%20optimizado.png');
    this.load.image('ally_cavallo',   BASE+'assets/allies/sprite%20cavallo%20optimizado.png');
    this.load.image('ally_sarmiento', BASE+'assets/allies/sprite%20sarmiento%20optimizado.png');
    this.load.image('ally_adam',      BASE+'assets/allies/sprite%20adam%20smith%20optimizado.png');
    this.load.image('ally_sanmartin', BASE+'assets/allies/sprite%20San%20Martin%20optimizado.png');
    this.load.image('ally_friedman',  BASE+'assets/allies/sprite%20friedman%20optimizado.png');
    this.load.image('ally_hayek',     BASE+'assets/allies/sprite%20hayek%20optimizado.png');
    this.load.image('ally_trump',     BASE+'assets/allies/sprite%20Trump%20optimizado.png');
    this.load.image('ally_elon',      BASE+'assets/allies/sprite%20elon%20musk%20optimizado.png');
    this.load.image('ally_espert',    BASE+'assets/allies/sprite%20Espert%20optimizado.png');
    this.load.image('ally_bullrich',  BASE+'assets/allies/sprite%20bullrich%20optimizado.png');

    // Spritesheets - using onFileComplete to detect actual frame sizes
    // Milei: single horizontal row, 13 frames
    this.load.spritesheet('milei',     BASE+'assets/sprites/spritesheets%20milei%20optimizado.png',           {frameWidth:96,  frameHeight:96 });
    this.load.spritesheet('cuca_k',    BASE+'assets/sprites/spritesheets%20cucaracha%20k%20optimizado.png',   {frameWidth:64,  frameHeight:64 });
    this.load.spritesheet('cuca_arm',  BASE+'assets/sprites/spritesheets%20cucaracha%20k%20armada%20optimizado.png',{frameWidth:96,frameHeight:72});
    this.load.spritesheet('sind',      BASE+'assets/sprites/spritesheets%20sindicalista%20optmizado.png',     {frameWidth:128, frameHeight:96 });
    this.load.spritesheet('del_cano',  BASE+'assets/sprites/spritesheets%20del%20ca%C3%B1o%20optimizado.png', {frameWidth:128, frameHeight:128});
    this.load.spritesheet('massa',     BASE+'assets/sprites/spritesheets%20massa%20optimizado.png',           {frameWidth:128, frameHeight:128});
    this.load.spritesheet('kicillof',  BASE+'assets/sprites/spritesheets%20kicillof%20optimizado.png',        {frameWidth:96,  frameHeight:128});
    this.load.spritesheet('cristina',  BASE+'assets/sprites/spritesheets%20cristina%20optimizado.png',        {frameWidth:128, frameHeight:128});
    this.load.spritesheet('larreta',   BASE+'assets/sprites/spritesheets%20larreta%20optimizado.png',         {frameWidth:96,  frameHeight:128});
    this.load.spritesheet('villarruel',BASE+'assets/sprites/spritesheets%20villarruel%20optimizado.png',      {frameWidth:96,  frameHeight:128});
    this.load.spritesheet('morsa',     BASE+'assets/sprites/spritesheets%20morsa%20fernandez.png',            {frameWidth:128, frameHeight:96 });
    this.load.spritesheet('moreno',    BASE+'assets/bosses/spritesheets%20moreno%20optimizado.png',           {frameWidth:128, frameHeight:128});
    this.load.spritesheet('boss_fmi',  BASE+'assets/bosses/boss%20fmi.png',                                   {frameWidth:160, frameHeight:160});
    this.load.spritesheet('macri',     BASE+'assets/sprites/spritesheets%20macri%20gato_macri_transparent%20opti....png',{frameWidth:128,frameHeight:96});
    this.load.spritesheet('alberto',   BASE+'assets/sprites/spritesheets%20cristina%20optimizado.png',        {frameWidth:128, frameHeight:128}); // placeholder until alberto loads

    // Power-ups: 5 groups x 4 frames each
    this.load.spritesheet('pups',      BASE+'assets/powerups/sprites%20power-ups.png',                        {frameWidth:48,  frameHeight:48 });

    // Audio
    this.load.audio('snd_zurdos',   BASE+'assets/music/voz_milei_zurdos.mp3');
    this.load.audio('snd_viva',     BASE+'assets/music/voz_milei_viva_libertad.mp3');
    this.load.audio('snd_completo', BASE+'assets/music/voz_milei_completo.mp3');
  }

  create(){
    // Generate a 1x1 white pixel texture for platforms
    const gfx = this.make.graphics({add:false});
    gfx.fillStyle(0xFFFFFF,1); gfx.fillRect(0,0,4,4);
    gfx.generateTexture('px',4,4); gfx.destroy();

    this._buildAnims();
    this.scene.start('Title');
  }

  _buildAnims(){
    const a = this.anims;
    const mk=(key,src,s,e,fps,rep)=>{
      if(!a.exists(key)) a.create({key,frames:a.generateFrameNumbers(src,{start:s,end:e}),frameRate:fps,repeat:rep??-1});
    };

    // Milei (13 frames horizontal row)
    mk('m_idle',  'milei',0,1,4);
    mk('m_walk',  'milei',2,5,12);
    mk('m_jump',  'milei',6,6,1);
    mk('m_atk',   'milei',7,10,14,-1+1);  // repeat:0
    mk('m_hit',   'milei',11,11,1,-1+1);
    mk('m_die',   'milei',11,12,6,-1+1);
    // fix repeat for non-looping
    ['m_atk','m_hit','m_die'].forEach(k=>{ if(a.exists(k)) a.get(k).repeat=0; });

    // Cucaracha K (7 frames)
    mk('ck_walk', 'cuca_k',0,2,8);
    mk('ck_die',  'cuca_k',3,6,8,-1+1); a.get('ck_die').repeat=0;

    // Cucaracha armada (8 frames)
    mk('ca_walk', 'cuca_arm',0,2,8);
    mk('ca_hit',  'cuca_arm',3,5,8,-1+1); a.get('ca_hit').repeat=0;
    mk('ca_die',  'cuca_arm',6,7,6,-1+1); a.get('ca_die').repeat=0;

    // Sindicalista (9 frames)
    mk('si_walk', 'sind',0,2,6);
    mk('si_atk',  'sind',3,5,8,-1+1); a.get('si_atk').repeat=0;
    mk('si_die',  'sind',6,8,6,-1+1); a.get('si_die').repeat=0;

    // Bosses (generic idle/atk/die for each)
    [
      {k:'dc', src:'del_cano',  i:[0,1], at:[2,7],  d:[8,11]},
      {k:'ma', src:'massa',     i:[0,1], at:[2,8],  d:[9,11]},
      {k:'ki', src:'kicillof',  i:[0,1], at:[2,8],  d:[9,10]},
      {k:'cf', src:'cristina',  i:[0,1], at:[2,8],  d:[9,10]},
      {k:'la', src:'larreta',   i:[0,1], at:[2,8],  d:[9,11]},
      {k:'vi', src:'villarruel',i:[0,1], at:[2,7],  d:[8,8] },
      {k:'mo', src:'morsa',     i:[0,1], at:[3,6],  d:[7,8] },
      {k:'mr', src:'moreno',    i:[0,1], at:[4,9],  d:[10,11]},
      {k:'ab', src:'alberto',   i:[0,1], at:[2,7],  d:[9,10]},
    ].forEach(b=>{
      mk(`${b.k}_idle`,b.src,b.i[0],b.i[1],4);
      mk(`${b.k}_atk`, b.src,b.at[0],b.at[1],8,-1+1); a.get(`${b.k}_atk`).repeat=0;
      mk(`${b.k}_die`, b.src,b.d[0],b.d[1],6,-1+1);   a.get(`${b.k}_die`).repeat=0;
    });

    // Boss FMI
    mk('fi_idle','boss_fmi',0,1,4);
    mk('fi_atk', 'boss_fmi',2,5,8,-1+1); a.get('fi_atk').repeat=0;
    mk('fi_die', 'boss_fmi',11,11,4,-1+1); a.get('fi_die').repeat=0;

    // Macri gato
    mk('mg_idle','macri',0,2,4);
    mk('mg_good','macri',4,4,4,-1+1); a.get('mg_good').repeat=0;
    mk('mg_bad', 'macri',5,5,4,-1+1); a.get('mg_bad').repeat=0;
    mk('mg_exit','macri',6,8,6,-1+1); a.get('mg_exit').repeat=0;

    // Power-ups (5 items × 4 frames)
    mk('pu_dollar',  'pups',0,3,8);
    mk('pu_chainsaw','pups',4,7,8);
    mk('pu_hayek',   'pups',8,11,8);
    mk('pu_mane',    'pups',12,15,8);
    mk('pu_shield',  'pups',16,19,8);
  }
}

// ═══════════════════════════════════════
// TITLE
// ═══════════════════════════════════════
class Title extends Phaser.Scene {
  constructor(){ super('Title'); }
  create(){
    window.GS = {lives:3,coins:0,fiscal:50,level:0,score:0,pendingPU:null};

    const bg = this.add.image(GW/2,GH/2,'bg_casa').setDisplaySize(GW,GH);
    this.add.rectangle(GW/2,GH/2,GW,GH,0x000022,0.6);

    // Stars
    for(let i=0;i<25;i++){
      const s=this.add.circle(Phaser.Math.Between(0,GW),Phaser.Math.Between(0,GH),Phaser.Math.Between(1,3),0xFFFFFF,Phaser.Math.FloatBetween(0.3,1));
      this.tweens.add({targets:s,alpha:0,duration:Phaser.Math.Between(600,2000),yoyo:true,repeat:-1,delay:Phaser.Math.Between(0,2000)});
    }

    // Title
    this.add.text(GW/2+3,73,'⚡ MILEI BROS ⚡',{fontSize:'50px',fill:'#000',fontFamily:'Arial Black'}).setOrigin(0.5);
    const ttl=this.add.text(GW/2,70,'⚡ MILEI BROS ⚡',{fontSize:'50px',fill:'#FFD700',stroke:'#7B3F00',strokeThickness:6,fontFamily:'Arial Black'}).setOrigin(0.5);
    this.tweens.add({targets:ttl,scaleX:1.04,scaleY:1.04,duration:900,yoyo:true,repeat:-1});

    // Milei sprite (use image fallback if spritesheet fails)
    let hero;
    try{
      hero=this.add.sprite(GW/2,GH/2-15,'milei').setScale(2.2);
      hero.play('m_idle');
    }catch(e){
      hero=this.add.rectangle(GW/2,GH/2-15,80,100,0x4444FF);
    }
    this.tweens.add({targets:hero,y:GH/2-25,duration:700,yoyo:true,repeat:-1,ease:'Sine.easeInOut'});

    // Enemies at sides
    try{
      const cl=this.add.sprite(55,GH-70,'cuca_k').setScale(2.2); cl.play('ck_walk');
      const cr=this.add.sprite(GW-55,GH-70,'cuca_k').setScale(2.2).setFlipX(true); cr.play('ck_walk');
    }catch(e){}

    // Coins row
    try{
      [90,210,330,470,590,710].forEach(x=>{
        const c=this.add.sprite(x,GH-35,'pups').setScale(1.3); c.play('pu_dollar');
      });
    }catch(e){}

    // Menu
    let sel=0;
    const opts=[
      {t:'▶  NUEVA PARTIDA', fn:()=>this._startGame()},
      {t:'⌨  CONTROLES',     fn:()=>this._showCtrls()},
      {t:'🏆  PUNTAJE: '+window.GS.score, fn:()=>{}},
    ];
    const mItems=opts.map((o,i)=>
      this.add.text(GW/2,GH/2+90+i*40,o.t,{
        fontSize:'20px',fill:i===0?'#FFD700':'#FFFFFF',
        fontFamily:'Arial Black',stroke:'#000',strokeThickness:3
      }).setOrigin(0.5).setInteractive()
    );
    mItems.forEach((m,i)=>{
      m.on('pointerdown',()=>opts[i].fn());
      m.on('pointerover',()=>{sel=i;upd();});
    });
    const upd=()=>mItems.forEach((m,i)=>m.setStyle({fill:i===sel?'#FFD700':'#FFF'}).setScale(i===sel?1.08:1));

    // Keyboard
    const kUp   = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.UP);
    const kDown = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.DOWN);
    const kEnter= this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.ENTER);
    const kSpace= this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);

    kUp.on('down',   ()=>{ sel=(sel-1+opts.length)%opts.length; upd(); });
    kDown.on('down', ()=>{ sel=(sel+1)%opts.length; upd(); });
    kEnter.on('down',()=>opts[sel].fn());
    kSpace.on('down',()=>opts[0].fn());

    // Press start
    const ps=this.add.text(GW/2,GH-28,'✦ PRESS ENTER TO START ✦',{fontSize:'13px',fill:'#fff',fontFamily:'Arial'}).setOrigin(0.5);
    this.tweens.add({targets:ps,alpha:0,duration:500,yoyo:true,repeat:-1});

    this.add.text(8,GH-16,'© 2025 VIVA LA LIBERTAD',{fontSize:'10px',fill:'#FFD700',fontFamily:'Arial'});
    this.add.text(GW/2,GH-50,'Flechas: Mover  |  Espacio/↑: Saltar  |  Z: Atacar  |  Shift: Correr  |  P: Pausa',{fontSize:'9px',fill:'#777',fontFamily:'Arial'}).setOrigin(0.5);
  }

  _startGame(){
    try{ this.scene.start('Game'); }
    catch(e){ console.error('Error starting game:',e); }
  }

  _showCtrls(){
    const panel=this.add.rectangle(GW/2,GH/2,460,280,0x000000,0.93).setDepth(10);
    const txt=this.add.text(GW/2,GH/2,[
      '─── CONTROLES ───','','← → : Moverse','↑ / Espacio : Saltar','↑ doble toque : Doble salto',
      'Shift : Correr','Z : Atacar / Motosierra','↓ : Agacharse','S : Usar power-up',
      'P / Esc : Pausar','','Click o cualquier tecla para cerrar'
    ].join('\n'),{fontSize:'14px',fill:'#FFD700',fontFamily:'Arial',align:'center',lineSpacing:4}).setOrigin(0.5).setDepth(11);
    panel.setInteractive().on('pointerdown',close);
    this.input.keyboard.once('keydown',close);
    function close(){ panel.destroy(); txt.destroy(); }
  }
}

// ═══════════════════════════════════════
// HUD (overlay scene)
// ═══════════════════════════════════════
class HUD extends Phaser.Scene {
  constructor(){ super({key:'HUD',active:false}); }
  create(){
    const s={fontSize:'15px',fontFamily:'Arial Black',stroke:'#000',strokeThickness:3};
    this.livTxt  = this.add.text(8,  6,'🦁 x3',   {...s,fill:'#fff'});
    this.scrTxt  = this.add.text(8, 26,'SCORE: 0', {fontSize:'11px',fill:'#FFD700',fontFamily:'Arial'});
    this.lvlTxt  = this.add.text(GW/2,6,'',        {...s,fill:'#fff'}).setOrigin(0.5,0);
    this.coinTxt = this.add.text(GW-8,6,'$ 0',     {...s,fill:'#FFD700'}).setOrigin(1,0);
    this.add.text(GW/2,26,'EQUILIBRIO FISCAL',{fontSize:'9px',fill:'#FFD700',fontFamily:'Arial'}).setOrigin(0.5,0);
    this.fBg  = this.add.rectangle(GW/2,42,180,10,0x222222).setOrigin(0.5);
    this.fBar = this.add.rectangle(GW/2-90,42,180,10,0x00FF00).setOrigin(0,0.5);
    this.puTxt= this.add.text(8,44,'',{fontSize:'10px',fill:'#00FFFF',fontFamily:'Arial'});
    // Boss bar
    this.bBg  = this.add.rectangle(GW/2,GH-20,400,14,0x440000).setOrigin(0.5).setVisible(false);
    this.bBar = this.add.rectangle(GW/2-200,GH-20,400,14,0xFF2200).setOrigin(0,0.5).setVisible(false);
    this.bNm  = this.add.text(GW/2,GH-34,'',{fontSize:'12px',fill:'#FF5555',fontFamily:'Arial Black',stroke:'#000',strokeThickness:3}).setOrigin(0.5).setVisible(false);

    this.game.events.on('hud',d=>{
      const gs=window.GS;
      this.livTxt.setText('🦁 x'+gs.lives);
      this.scrTxt.setText('SCORE: '+gs.score);
      this.lvlTxt.setText(d.lvl||'');
      this.coinTxt.setText('$ '+gs.coins);
      const fw=Math.max(0,(gs.fiscal/100)*180);
      this.fBar.width=fw;
      this.fBar.fillColor = gs.fiscal>60?0x00CC00:gs.fiscal>30?0xFFCC00:0xFF2200;
      this.puTxt.setText(d.pu?'⚡ '+d.pu:'');
      if(d.bhp!=null){
        this.bBg.setVisible(true); this.bBar.setVisible(true); this.bNm.setVisible(true);
        this.bNm.setText(d.bnm||'');
        this.bBar.width=Math.max(0,(d.bhp/d.bmx)*400);
      }else{
        this.bBg.setVisible(false); this.bBar.setVisible(false); this.bNm.setVisible(false);
      }
    });
  }
}

// ═══════════════════════════════════════
// SHOP (Espert between levels)
// ═══════════════════════════════════════
class Shop extends Phaser.Scene {
  constructor(){ super('Shop'); }
  create(){
    const gs=window.GS;
    this.add.rectangle(GW/2,GH/2,GW,GH,0x050505,0.96);
    const espert=this.add.image(160,GH/2+20,'ally_espert').setScale(0.55);
    this.tweens.add({targets:espert,y:espert.y-10,duration:900,yoyo:true,repeat:-1,ease:'Sine.easeInOut'});
    this.add.text(GW/2+40,16,'🏪 LIBRE MERCADO SHOP',{fontSize:'22px',fill:'#FFD700',fontFamily:'Arial Black',stroke:'#000',strokeThickness:4}).setOrigin(0.5,0);
    this.mTxt=this.add.text(GW/2+40,50,'Monedas: $'+gs.coins,{fontSize:'15px',fill:'#00FF00',fontFamily:'Arial'}).setOrigin(0.5,0);
    this.chosenPU=null;

    const items=[
      {l:'🔧 Motosierra+', p:50, pu:'chainsaw', d:'Daño doble 20s'},
      {l:'📖 Libro Hayek',  p:75, pu:'hayek',   d:'Invencible 10s'},
      {l:'🦁 Peluca León',  p:40, pu:'mane',    d:'Velocidad x2 10s'},
      {l:'💰 Dolarito',     p:60, pu:'shield',  d:'Absorbe 3 golpes'},
      {l:'❤️ Vida extra',   p:100,pu:'life',    d:'+1 vida'},
    ];
    const qq=['"¡Excelente inversión!"','"El mercado siempre tiene razón"','"¡Comprá antes que se infle!"','"Puro libre mercado"'];

    items.forEach((item,i)=>{
      const by=95+i*52, ok=gs.coins>=item.p;
      const btn=this.add.rectangle(GW/2+40,by,330,44,ok?0x143014:0x1a1a1a).setInteractive().setOrigin(0.5);
      this.add.text(GW/2+40-145,by,item.l,{fontSize:'14px',fill:ok?'#FFD700':'#555',fontFamily:'Arial Black'}).setOrigin(0,0.5);
      this.add.text(GW/2+40+110,by-9,'$'+item.p,{fontSize:'13px',fill:ok?'#00FF00':'#444',fontFamily:'Arial'}).setOrigin(0.5);
      this.add.text(GW/2+40+110,by+9,item.d,{fontSize:'10px',fill:'#888',fontFamily:'Arial'}).setOrigin(0.5);
      if(ok){
        btn.on('pointerover',()=>btn.setFillStyle(0x1d551d));
        btn.on('pointerout', ()=>btn.setFillStyle(0x143014));
        btn.on('pointerdown',()=>{
          gs.coins-=item.p; this.chosenPU=item.pu;
          this.mTxt.setText('Monedas: $'+gs.coins);
          btn.setFillStyle(0x003300);
          const qt=this.add.text(GW/2+40,GH-42,qq[Math.floor(Math.random()*qq.length)],{fontSize:'12px',fill:'#fff',fontFamily:'Arial',fontStyle:'italic'}).setOrigin(0.5).setDepth(5);
          this.time.delayedCall(2200,()=>qt.destroy());
        });
      }
    });

    const cont=this.add.text(GW/2+40,GH-14,'▶ CONTINUAR →',{fontSize:'16px',fill:'#FFD700',fontFamily:'Arial Black',stroke:'#000',strokeThickness:3}).setOrigin(0.5).setInteractive();
    cont.on('pointerover',()=>cont.setFill('#FFA500'));
    cont.on('pointerout', ()=>cont.setFill('#FFD700'));
    cont.on('pointerdown',()=>this._go());
    this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.ENTER).on('down',()=>this._go());
    this.input.keyboard.addKey('E').on('down',()=>this._go());
  }
  _go(){
    window.GS.pendingPU=this.chosenPU;
    this.scene.stop('HUD');
    this.scene.start('Game');
  }
}

// ═══════════════════════════════════════
// GAME SCENE
// ═══════════════════════════════════════
class Game extends Phaser.Scene {
  constructor(){ super('Game'); }

  create(){
    const gs=window.GS;
    const lv=LEVELS[gs.level]||LEVELS[0];
    this.lv=lv;

    // State
    this.attacking=false; this.invincible=false;
    this.chainsawOn=false; this.activePU=null;
    this.combo=0; this.bossSpawned=false; this.allyGiven=false;
    this.bossRef=null; this.bossHP=lv.bossHP; this.bossMaxHP=lv.bossHP;
    this.done=false; this.paused=false; this.pauseUI=null;
    this.bossAITimer=null;

    const WW=5200;

    // Apply shop power-up
    if(gs.pendingPU){ this._applyPU(gs.pendingPU); gs.pendingPU=null; }

    // Physics
    this.physics.world.setBounds(0,0,WW,GH);
    this.physics.world.gravity.y=1400;

    // Background
    this.add.image(0,0,lv.bg).setOrigin(0,0).setDisplaySize(WW,GH);

    // Platforms
    this.plats=this.physics.add.staticGroup();
    this._buildWorld(WW);

    // Player
    this.p=this.physics.add.sprite(130,GH-130,'milei');
    this.p.setScale(1.6).setCollideWorldBounds(true).setMaxVelocityX(RUN).setDragX(DRAG).setDepth(10);
    this.p.play('m_idle'); this.p.facing=1; this.p.isDead=false; this.p.djUsed=false;
    this.cameras.main.setBounds(0,0,WW,GH);
    this.cameras.main.startFollow(this.p,true,0.09,0.09);
    this.cameras.main.setDeadzone(100,50);

    // Enemy group
    this.enemies=this.physics.add.group();
    this._spawnEnemies(WW);

    // Coins
    this.coinGrp=this.physics.add.group();
    this._spawnCoins(WW);

    // Powerups
    this.puGrp=this.physics.add.group();
    this._spawnPUs(WW);

    // Projectiles
    this.projGrp=this.physics.add.group();

    // Colliders
    this.physics.add.collider(this.p,       this.plats);
    this.physics.add.collider(this.enemies, this.plats);
    this.physics.add.collider(this.coinGrp, this.plats);
    this.physics.add.collider(this.puGrp,   this.plats);
    this.physics.add.collider(this.projGrp, this.plats,(pr)=>pr.destroy());

    this.physics.add.overlap(this.p, this.enemies,  this._onEnemy, null, this);
    this.physics.add.overlap(this.p, this.coinGrp,  this._onCoin,  null, this);
    this.physics.add.overlap(this.p, this.puGrp,    this._onPU,    null, this);
    this.physics.add.overlap(this.p, this.projGrp,  (pl,pr)=>{ pr.destroy(); if(!this.invincible)this._damage(); });

    // Trigger tracking (checked in update by position)
    this.allyTriggerX = WW/2;
    this.bossTriggerX = WW-800;

    // Controls (use addKey to avoid ghost events)
    const KC=Phaser.Input.Keyboard.KeyCodes;
    this.kLeft  = this.input.keyboard.addKey(KC.LEFT);
    this.kRight = this.input.keyboard.addKey(KC.RIGHT);
    this.kDown  = this.input.keyboard.addKey(KC.DOWN);
    this.kShift = this.input.keyboard.addKey(KC.SHIFT);
    this.kZ     = this.input.keyboard.addKey('Z');
    this.kUp    = this.input.keyboard.addKey(KC.UP);
    this.kSpace = this.input.keyboard.addKey(KC.SPACE);
    this.kP     = this.input.keyboard.addKey('P');
    this.kEsc   = this.input.keyboard.addKey(KC.ESC);

    this.kUp.on('down',    ()=>this._jump());
    this.kSpace.on('down', ()=>this._jump());
    this.kZ.on('down',     ()=>this._attack());
    this.kP.on('down',     ()=>this._pause());
    this.kEsc.on('down',   ()=>this._pause());

    // HUD
    this.scene.launch('HUD');
    this._hudUpdate();

    // Audio
    this.sZurdos   = this.sound.add('snd_zurdos',   {volume:0.9});
    this.sViva     = this.sound.add('snd_viva',     {volume:0.9});
    this.sCompleto = this.sound.add('snd_completo', {volume:0.9});

    // Fiscal timer
    this.time.addEvent({delay:4500, loop:true, callback:()=>{
      if(!this.done && !this.paused){
        gs.fiscal=Math.max(0,gs.fiscal-2);
        if(gs.fiscal<=0) this._damage();
        this._hudUpdate();
      }
    }});

    // Macri gato random
    this.time.delayedCall(22000,()=>this._macri());

    // Level intro
    this._banner(`MUNDO ${gs.level+1} - ${lv.name}`,'#FFD700',2500);
  }

  // ── World ──
  _buildWorld(WW){
    // Ground
    this._addPlat(WW/2,GH-16,WW,32,0x5C3A1E,0x8B6342);
    // Platform rows
    const layout=[
      350,300,140, 600,240,120, 880,320,100, 1150,260,130,
      1420,330,110, 1680,200,140, 1950,280,120, 2220,340,100,
      2490,250,130, 2760,310,100, 3030,220,140, 3300,360,110,
      3570,270,120, 3840,240,100, 4110,310,130, 4380,200,110,
      4650,330,120
    ];
    for(let i=0;i<layout.length;i+=3){
      this._addPlat(layout[i],layout[i+1],layout[i+2],14,0x7B4F2E,0xA86C3E);
    }
  }

  _addPlat(x,y,w,h,col,topCol){
    // Visual
    const g=this.add.graphics();
    g.fillStyle(col,1); g.fillRect(x-w/2,y-h/2,w,h);
    g.fillStyle(topCol||col,1); g.fillRect(x-w/2,y-h/2,w,4);
    // Physics body
    const body=this.plats.create(x,y,'px').setDisplaySize(w,h).setAlpha(0);
    body.refreshBody();
  }

  // ── Enemies ──
  _spawnEnemies(WW){
    [450,800,1150,1550,1900,2300,2650,3050,3400,3800,4200,4600].forEach(x=>
      this._addEnemy('cuca_k',x,GH-80,1,'ck_walk',62));
    [1100,2400,3700].forEach(x=>
      this._addEnemy('cuca_arm',x,GH-80,2,'ca_walk',45));
    [1700,3200,4500].forEach(x=>
      this._addEnemy('sind',x,GH-85,3,'si_walk',32));
  }

  _addEnemy(tex,x,y,hp,anim,spd){
    const e=this.physics.add.sprite(x,y,tex).setScale(tex==='sind'?1.35:1.5);
    e.setCollideWorldBounds(true); e.setVelocityX(-spd);
    e.hp=hp; e.maxHp=hp; e.spd=spd; e.tex=tex; e.isDead=false; e._dir=-1;
    try{ e.play(anim); }catch(err){}
    e.setDepth(5);
    this.enemies.add(e);
  }

  _spawnCoins(WW){
    for(let x=300;x<WW-300;x+=160){
      if(Math.random()>0.4){
        const c=this.physics.add.sprite(x,GH-150-Math.random()*80,'pups').setFrame(0).setScale(1.1);
        c.setGravityY(-1400+150); // slight float
        this.coinGrp.add(c);
      }
    }
  }

  _spawnPUs(WW){
    const types=['dollar','chainsaw','shield','hayek','mane'];
    [700,1600,2500,3400,4300].forEach((x,i)=>{
      const pu=this.physics.add.sprite(x,GH-200,'pups');
      pu.puType=types[i%5]; pu.setScale(1.7); pu.setBounce(0.35);
      try{ pu.play('pu_'+pu.puType); }catch(e){}
      this.puGrp.add(pu);
    });
  }

  // ── Player actions ──
  _jump(){
    if(this.paused||this.p.isDead) return;
    const onG=this.p.body.blocked.down;
    if(onG){ this.p.setVelocityY(JUMP_V); this.p.djUsed=false; }
    else if(!this.p.djUsed){ this.p.setVelocityY(DJUMP_V); this.p.djUsed=true; this.cameras.main.shake(70,0.004); this._floatTxt(this.p.x,this.p.y+20,'✨','#FFD700',400); }
  }

  _attack(){
    if(this.paused||this.attacking||this.p.isDead) return;
    this.attacking=true;
    try{ this.p.play('m_atk',true); }catch(e){}
    if(this.chainsawOn && !this.sZurdos.isPlaying) this.sZurdos.play();

    const dir=this.p.facing;
    const hx=this.p.x+dir*70, hy=this.p.y;
    const hitR=new Phaser.Geom.Rectangle(hx-40,hy-40,80,80);

    this.enemies.getChildren().forEach(e=>{
      if(e.active&&!e.isDead&&Phaser.Geom.Intersects.RectangleToRectangle(hitR,e.getBounds()))
        this._hitEnemy(e);
    });
    if(this.bossRef&&this.bossRef.active&&!this.bossRef.isDead&&
       Phaser.Geom.Intersects.RectangleToRectangle(hitR,this.bossRef.getBounds()))
      this._hitBoss();

    const fl=this.add.rectangle(hx,hy,80,70,0xFFFF00,0.22).setDepth(20);
    this.time.delayedCall(80,()=>fl.destroy());
    this.time.delayedCall(360,()=>{ this.attacking=false; if(!this.p.isDead){try{this.p.play('m_idle',true);}catch(e){}} });
  }

  _hitEnemy(e){
    const dmg=this.chainsawOn?2:1;
    e.hp-=dmg;
    this.cameras.main.shake(90,0.005);
    this.tweens.add({targets:e,tint:0xFF0000,duration:80,yoyo:true});
    this._floatTxt(e.x,e.y-20,'-'+dmg,'#FF4444');
    if(e.hp<=0) this._killEnemy(e);
    else if(e.tex==='cuca_arm'){ try{e.play('ca_hit',true);}catch(err){}; this.time.delayedCall(400,()=>{if(e.active)try{e.play('ca_walk',true);}catch(err){}}); }
  }

  _killEnemy(e){
    if(e.isDead) return; e.isDead=true;
    e.setVelocity(0,-110).setDepth(3);
    const da={cuca_k:'ck_die',cuca_arm:'ca_die',sind:'si_die'}[e.tex]||'ck_die';
    try{ e.play(da,true); }catch(err){}
    window.GS.coins+=5; window.GS.score+=100; window.GS.fiscal=Math.min(100,window.GS.fiscal+3);
    this._floatTxt(e.x,e.y-20,'+$5','#FFD700');
    this.combo++;
    if(this.combo>=5){ this._banner('¡COMBO x5!\n¡AFUERA!','#FFD700',1500); if(!this.sViva.isPlaying)this.sViva.play(); this.combo=0; }
    this.time.delayedCall(750,()=>{if(e.active)e.destroy();});
    this._hudUpdate();
  }

  _onEnemy(pl,e){
    if(this.invincible||pl.isDead||e.isDead) return;
    if(pl.body.velocity.y>60&&pl.y<e.y-20){ this._hitEnemy(e); pl.setVelocityY(JUMP_V*0.45); }
    else this._damage();
  }

  _onCoin(pl,c){
    c.destroy(); window.GS.coins++; window.GS.score+=10; window.GS.fiscal=Math.min(100,window.GS.fiscal+1);
    this._floatTxt(c.x,c.y,'+$1','#FFD700',500);
    this._hudUpdate();
  }

  _onPU(pl,pu){ const t=pu.puType; pu.destroy(); this.cameras.main.flash(220,255,210,0); this._applyPU(t); }

  _applyPU(type){
    const labels={dollar:'Motosierra',chainsaw:'Motosierra MAX',shield:'Escudo $',hayek:'Modo Hayek',mane:'Peluca León',life:'Vida Extra'};
    this.activePU=labels[type]||type;
    switch(type){
      case 'dollar': case 'chainsaw':
        this.chainsawOn=true; if(!this.sZurdos.isPlaying)this.sZurdos.play();
        this._banner('¡MOTOSIERRA ACTIVADA!\n¡Zurdos tiemblen!','#FFD700',2000);
        this.time.delayedCall(type==='chainsaw'?20000:15000,()=>{this.chainsawOn=false;this.activePU=null;this._hudUpdate();});
        break;
      case 'shield':
        this.invincible=true; this._banner('¡DOLARITO ESCUDO!\n¡INVENCIBLE!','#00FFFF',2000);
        this.time.delayedCall(15000,()=>{this.invincible=false;this.activePU=null;this._hudUpdate();});
        break;
      case 'hayek':
        this.invincible=true; this._banner('¡LIBRO DE HAYEK!\n¡LIBERTAD TOTAL!','#FFFFFF',2000);
        this.time.delayedCall(10000,()=>{this.invincible=false;this.activePU=null;this._hudUpdate();});
        break;
      case 'mane':
        this.p.setMaxVelocityX(RUN*1.9); this._banner('¡PELUCA DE LEÓN!\n¡VELOCIDAD MÁXIMA!','#DAA520',2000);
        this.time.delayedCall(10000,()=>{this.p.setMaxVelocityX(RUN);this.activePU=null;this._hudUpdate();});
        break;
      case 'life':
        window.GS.lives++; this._banner('¡VIDA EXTRA!','#FF69B4',1500); break;
    }
    this._hudUpdate();
  }

  // ── Ally ──
  _spawnAlly(){
    const cfg=this.lv;
    const ax=Math.min(this.p.x+450, this.allyTriggerX+100);
    const ally=this.add.image(ax,GH-160,cfg.ally).setScale(0.65).setAlpha(0).setDepth(8);
    this.tweens.add({targets:ally,alpha:1,duration:800});
    this.tweens.add({targets:ally,y:ally.y-12,duration:900,yoyo:true,repeat:-1,ease:'Sine.easeInOut',delay:800});
    const lbl=this.add.text(ax,GH-260,'✨ '+cfg.allyName+' ✨\n¡Tócalo para obtener un poder!',{fontSize:'12px',fill:'#FFD700',fontFamily:'Arial',align:'center',backgroundColor:'#000000AA',padding:{x:6,y:3}}).setOrigin(0.5).setDepth(9);

    this.physics.world.enable(ally); ally.body.allowGravity=false;
    const ov=this.physics.add.overlap(this.p,ally,()=>{
      this.physics.world.removeCollider(ov); lbl.destroy();
      this.cameras.main.flash(350,255,215,0);
      const allyPUs={'ally_alberdi':'shield','ally_cavallo':'dollar','ally_sarmiento':'hayek','ally_nisman':'chainsaw','ally_adam':'dollar','ally_sanmartin':'chainsaw','ally_friedman':'shield','ally_hayek':'chainsaw'};
      this._applyPU(allyPUs[cfg.ally]||'shield');
      const msgs={'ally_alberdi':'"La Constitución es el escudo"','ally_nisman':'"La verdad sale a la luz"','ally_cavallo':'"Un peso, un dólar"','ally_sarmiento':'"¡Educar al soberano!"','ally_adam':'"The invisible hand"','ally_sanmartin':'"Seamos libres"','ally_friedman':'"No free lunch"','ally_hayek':'"The road to serfdom"'};
      this._banner(msgs[cfg.ally]||'¡Poder!','#FFD700',2500);
      this.tweens.add({targets:ally,alpha:0,duration:600,onComplete:()=>ally.destroy()});
    },null,this);
    this.time.delayedCall(9000,()=>{ if(ally.active){lbl.destroy();this.tweens.add({targets:ally,alpha:0,duration:700,onComplete:()=>ally.destroy()}); }});
  }

  // ── Boss ──
  _launchBoss(){
    this.cameras.main.shake(500,0.018);
    this._banner('⚠ BOSS FIGHT ⚠\n'+this.lv.bossName,'#FF0000',3000);
    this.time.delayedCall(2200,()=>{
      const bx=this.cameras.main.scrollX+GW-80;
      const bkey=this.lv.boss;
      const idleMap={del_cano:'dc_idle',massa:'ma_idle',kicillof:'ki_idle',cristina:'cf_idle',larreta:'la_idle',villarruel:'vi_idle',morsa:'mo_idle',moreno:'mr_idle',boss_fmi:'fi_idle',alberto:'ab_idle'};

      this.bossRef=this.physics.add.sprite(bx,GH-140,bkey).setScale(bkey==='boss_fmi'?1.7:2.1).setCollideWorldBounds(true).setDepth(8);
      this.bossRef.isDead=false; this.bossRef.hp=this.bossHP;
      try{ this.bossRef.play(idleMap[bkey]||'dc_idle',true); }catch(e){}

      this.physics.add.collider(this.bossRef,this.plats);
      this.physics.add.overlap(this.p,this.bossRef,()=>{ if(!this.invincible&&!this.bossRef.isDead&&!this.p.isDead)this._damage(); },null,this);

      this.bossAITimer=this.time.addEvent({delay:1700,loop:true,callback:()=>this._bossAI()});
      this._hudUpdate();
    });
  }

  _bossAI(){
    const b=this.bossRef;
    if(!b||!b.active||b.isDead||this.p.isDead) return;
    const dx=this.p.x-b.x;
    const spd=65+window.GS.level*7;
    b.setVelocityX(dx>0?spd:-spd); b.setFlipX(dx<0);

    const roll=Math.random();
    const atkMap={del_cano:'dc_atk',massa:'ma_atk',kicillof:'ki_atk',cristina:'cf_atk',larreta:'la_atk',villarruel:'vi_atk',morsa:'mo_atk',moreno:'mr_atk',boss_fmi:'fi_atk',alberto:'ab_atk'};
    const ak=atkMap[this.lv.boss]||'dc_atk';

    if(roll<0.28&&b.body.blocked.down) b.setVelocityY(JUMP_V*0.72);
    else if(roll<0.55){
      try{b.play(ak,true);}catch(e){}
      this.time.delayedCall(280,()=>{if(b&&b.active)this._spawnProj(b.x+(dx>0?50:-50),b.y,dx>0?210:-210,-85);});
    } else if(roll<0.72&&Math.abs(dx)<380) b.setVelocityX(dx>0?spd*2.3:-spd*2.3);
    else if(roll<0.85){
      // Summon enemy reinforcement
      this._addEnemy('cuca_k',b.x+Phaser.Math.Between(-200,200),GH-80,1,'ck_walk',65);
      this._floatTxt(b.x,b.y-60,'¡REFUERZOS!','#FF0000');
    }
    this.time.delayedCall(550,()=>{ const idleMap2={del_cano:'dc_idle',massa:'ma_idle',kicillof:'ki_idle',cristina:'cf_idle',larreta:'la_idle',villarruel:'vi_idle',morsa:'mo_idle',moreno:'mr_idle',boss_fmi:'fi_idle',alberto:'ab_idle'}; if(b&&b.active&&!b.isDead)try{b.play(idleMap2[this.lv.boss]||'dc_idle',true);}catch(e){} });
  }

  _spawnProj(x,y,vx,vy){
    const pr=this.add.rectangle(x,y,22,12,0xFF2200).setDepth(12);
    this.physics.add.existing(pr); pr.body.setVelocity(vx,vy);
    this.projGrp.add(pr);
    this.time.delayedCall(3500,()=>{if(pr.active)pr.destroy();});
  }

  _hitBoss(){
    if(!this.bossRef||this.bossRef.isDead) return;
    const dmg=this.chainsawOn?18:10;
    this.bossRef.hp-=dmg; this.bossHP=this.bossRef.hp;
    this.cameras.main.shake(160,0.01);
    this.tweens.add({targets:this.bossRef,tint:0xFF0000,duration:110,yoyo:true});
    this._floatTxt(this.bossRef.x,this.bossRef.y-40,'-'+dmg,'#FF0000');
    window.GS.score+=50;
    if(this.bossRef.hp<=0) this._bossDie();
    this._hudUpdate();
  }

  _bossDie(){
    if(this.bossRef.isDead) return;
    this.bossRef.isDead=true;
    if(this.bossAITimer) this.bossAITimer.remove();
    const dieMap={del_cano:'dc_die',massa:'ma_die',kicillof:'ki_die',cristina:'cf_die',larreta:'la_die',villarruel:'vi_die',morsa:'mo_die',moreno:'mr_die',boss_fmi:'fi_die',alberto:'ab_die'};
    try{this.bossRef.play(dieMap[this.lv.boss]||'dc_die',true);}catch(e){}
    this.cameras.main.shake(700,0.022);
    const deathQ={del_cano:'"¡El pueblo unido!"',massa:'"Yo siempre estuve en contra"',kicillof:'"La culpa es de Milei"',cristina:'"¡Me persiguen!"',larreta:'"Esto es lo que siempre quise"',villarruel:'"Sirvo a la patria"',moreno:'"¡TE VOY A ROMPER!"',boss_fmi:'"¡VIVA LA CASTA!"',alberto:'"No sabía nada"'};
    this._banner(deathQ[this.lv.boss]||'"¡Derrotado!"','#FF6600',3000);
    this.time.delayedCall(3200,()=>{
      this.done=true; this.bossHP=0;
      const gs=window.GS;
      gs.score+=1000; gs.fiscal=Math.min(100,gs.fiscal+20); gs.coins+=20;
      if(gs.level>=LEVELS.length-1){
        this._banner('🏆 ¡JUEGO COMPLETADO!\n¡VIVA LA LIBERTAD CARAJO!','#FFD700',6000);
        this.sCompleto.play();
        this.time.delayedCall(7000,()=>{ this.scene.stop('HUD'); this.scene.start('Title'); });
      } else {
        this._banner('¡NIVEL COMPLETADO!\n¡LIBERTAD!','#FFD700',2500);
        if(!this.sViva.isPlaying)this.sViva.play();
        this.time.delayedCall(3200,()=>{ gs.level++; this.scene.stop('HUD'); this.scene.start('Shop'); });
      }
    });
  }

  // ── Damage / Death ──
  _damage(){
    if(this.invincible||this.p.isDead) return;
    window.GS.lives--; this.invincible=true;
    try{this.p.play('m_hit',true);}catch(e){}
    this.cameras.main.shake(220,0.016);
    this.tweens.add({targets:this.p,alpha:0.3,duration:80,yoyo:true,repeat:13,onComplete:()=>{ this.invincible=false; this.p.alpha=1; if(!this.p.isDead)try{this.p.play('m_idle',true);}catch(e){} }});
    if(window.GS.lives<=0) this._die();
    this._hudUpdate();
  }

  _die(){
    if(this.p.isDead) return;
    this.p.isDead=true;
    try{this.p.play('m_die',true);}catch(e){}
    this.p.setVelocity(0,-260);
    this._banner('GAME OVER\n"El camino es duro pero vale la pena"','#FF0000',4000);
    this.time.delayedCall(5000,()=>{ window.GS={lives:3,coins:0,fiscal:50,level:0,score:0,pendingPU:null}; this.scene.stop('HUD'); this.scene.start('Title'); });
  }

  // ── Macri Gato ──
  _macri(){
    const mx=this.p.x+500;
    const mg=this.add.sprite(mx,GH-75,'macri').setScale(1.55).setDepth(9);
    try{mg.play('mg_idle');}catch(e){}
    const mt=this.add.text(mx,GH-135,'¡MIAU!',{fontSize:'16px',fill:'#FFD700',fontFamily:'Arial Black',stroke:'#000',strokeThickness:3}).setOrigin(0.5).setDepth(10);
    this.physics.world.enable(mg); mg.body.allowGravity=false;
    const ov=this.physics.add.overlap(this.p,mg,()=>{
      this.physics.world.removeCollider(ov); mt.destroy();
      const good=Math.random()>0.45;
      if(good){ try{mg.play('mg_good',true);}catch(e){} window.GS.coins+=20; window.GS.fiscal=Math.min(100,window.GS.fiscal+20); this.invincible=true; this.time.delayedCall(12000,()=>this.invincible=false); this._banner('¡MACRI DA PREMIO!\n+20 monedas + escudo','#00FF00',2000); }
      else{ try{mg.play('mg_bad',true);}catch(e){} window.GS.coins=Math.max(0,window.GS.coins-10); window.GS.fiscal=Math.max(0,window.GS.fiscal-15); this._banner('¡SORPRESA MACRI!\n-10 monedas\n"No sabíamos lo que había"','#FF6600',2000); }
      this.time.delayedCall(1500,()=>{ try{mg.play('mg_exit',true);}catch(e){} this.tweens.add({targets:mg,x:mg.x+280,alpha:0,duration:900,onComplete:()=>mg.destroy()}); });
      this._hudUpdate();
    },null,this);
    this.time.delayedCall(9000,()=>{ if(mg.active){mt.destroy();this.tweens.add({targets:mg,alpha:0,duration:700,onComplete:()=>mg.destroy()});} });
  }

  // ── Pause ──
  _pause(){
    this.paused=!this.paused;
    if(this.paused){
      this.physics.pause();
      const sx=this.cameras.main.scrollX;
      const bg=this.add.rectangle(GW/2+sx,GH/2,400,200,0x000000,0.9).setDepth(100);
      const t1=this.add.text(GW/2+sx,GH/2-55,'⏸ PAUSADO',{fontSize:'28px',fill:'#FFD700',fontFamily:'Arial Black',stroke:'#000',strokeThickness:5}).setOrigin(0.5).setDepth(101);
      const t2=this.add.text(GW/2+sx,GH/2-10,'P / ESC → Continuar',{fontSize:'16px',fill:'#fff',fontFamily:'Arial'}).setOrigin(0.5).setDepth(101);
      const t3=this.add.text(GW/2+sx,GH/2+20,'Vidas: '+window.GS.lives+' | $'+window.GS.coins+' | Score: '+window.GS.score,{fontSize:'13px',fill:'#FFD700',fontFamily:'Arial'}).setOrigin(0.5).setDepth(101);
      this.pauseUI=[bg,t1,t2,t3];
    } else {
      this.physics.resume();
      if(this.pauseUI){ this.pauseUI.forEach(o=>o.destroy()); this.pauseUI=null; }
    }
  }

  // ── HUD ──
  _hudUpdate(){
    this.game.events.emit('hud',{
      lvl:'MUNDO '+(window.GS.level+1)+' - '+this.lv.name,
      pu: this.activePU,
      bhp:this.bossRef&&!this.bossRef.isDead?this.bossHP:null,
      bmx:this.bossMaxHP,
      bnm:this.lv.bossName
    });
  }

  // ── Helpers ──
  _banner(txt,col,dur){
    const sx=this.cameras.main.scrollX;
    const bg=this.add.rectangle(GW/2+sx,GH/2,500,90,0x000000,0.88).setDepth(60);
    const t=this.add.text(GW/2+sx,GH/2,txt,{fontSize:'21px',fill:col,fontFamily:'Arial Black',stroke:'#000',strokeThickness:5,align:'center'}).setOrigin(0.5).setDepth(61);
    this.tweens.add({targets:[bg,t],alpha:0,duration:dur,onComplete:()=>{ bg.destroy(); t.destroy(); }});
  }

  _floatTxt(x,y,txt,col,dur=700){
    const t=this.add.text(x,y,txt,{fontSize:'14px',fill:col,fontFamily:'Arial Black',stroke:'#000',strokeThickness:3}).setOrigin(0.5).setDepth(55);
    this.tweens.add({targets:t,y:y-50,alpha:0,duration:dur,onComplete:()=>t.destroy()});
  }

  // ══ UPDATE LOOP ══
  update(){
    if(this.paused||!this.p||this.p.isDead) return;

    const gs=window.GS;
    const dt=this.game.loop.delta/1000;
    const onG=this.p.body.blocked.down;
    const vx=this.p.body.velocity.x;
    const running=this.kShift.isDown;
    const maxSpd=running?RUN:WALK;

    // Horizontal movement (NES-style gradual accel/decel)
    if(this.kLeft.isDown){
      this.p.facing=-1; this.p.setFlipX(true);
      this.p.body.velocity.x=Math.max(vx-ACCEL*dt,-maxSpd);
    } else if(this.kRight.isDown){
      this.p.facing=1; this.p.setFlipX(false);
      this.p.body.velocity.x=Math.min(vx+ACCEL*dt,maxSpd);
    } else {
      if(Math.abs(vx)<6) this.p.body.velocity.x=0;
      else this.p.body.velocity.x-=Math.sign(vx)*DRAG*dt;
    }

    // Duck
    this.p.setScale(1.6, (this.kDown.isDown&&onG)?0.85:1.6);

    // Animations
    if(!this.attacking){
      const mv=Math.abs(this.p.body.velocity.x)>8;
      try{
        if(!onG)        this.p.play('m_jump',true);
        else if(mv)     this.p.play('m_walk',true);
        else            this.p.play('m_idle',true);
      }catch(e){}
    }

    // Reset double jump
    if(onG) this.p.djUsed=false;

    // Enemy AI
    this.enemies.getChildren().forEach(e=>{
      if(!e.active||e.isDead) return;
      const dx=e.x-this.p.x;
      if(Math.abs(dx)<480){
        e.setVelocityX(dx>0?-e.spd:e.spd); e.setFlipX(dx>0);
      } else {
        if(e.body.blocked.right||e.body.blocked.left) e._dir*=-1;
        if(!e._dir) e._dir=-1;
        e.setVelocityX(e._dir*e.spd*0.55); e.setFlipX(e._dir<0);
      }
      if((e.body.blocked.right||e.body.blocked.left)&&e.body.blocked.down) e.setVelocityY(JUMP_V*0.5);
    });

    // Boss follow
    if(this.bossRef&&this.bossRef.active&&!this.bossRef.isDead){
      const bdx=this.p.x-this.bossRef.x; this.bossRef.setFlipX(bdx<0);
    }

    // Projectile cleanup
    this.projGrp.getChildren().forEach(pr=>{ if(pr.y>GH+40||pr.x<-50||pr.x>6000)pr.destroy(); });

    // Fall death
    if(this.p.y>GH+40) this._die();

    // Trigger checks by player X position
    if(!this.allyGiven&&this.p.x>this.allyTriggerX){ this.allyGiven=true; this._spawnAlly(); }
    if(!this.bossSpawned&&this.p.x>this.bossTriggerX){ this.bossSpawned=true; this._launchBoss(); }

    // HUD update (every 10 frames)
    if(this.game.loop.frame%10===0) this._hudUpdate();
  }
}

// ═══════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════
new Phaser.Game({
  type: Phaser.AUTO,
  width: GW, height: GH,
  backgroundColor:'#0a0a1a',
  physics:{ default:'arcade', arcade:{gravity:{y:0},debug:false} },
  scene:[Boot,Title,HUD,Shop,Game],
  scale:{ mode:Phaser.Scale.FIT, autoCenter:Phaser.Scale.CENTER_BOTH }
});
</script>
